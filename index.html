<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNEWIT 프로토타입</title>
<meta name="description" content="KNEWIT 인터랙티브 프로토타입 — 버전별·날짜별 보기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --ground:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --ink:#131C2E; --ink-2:#3D4A61; --ink-3:#5C6879;
  --line:#D8DFE9; --brand:#2F6FEB; --brand-soft:#E4EDFD; --brand-ink:#1B4FB0;
  --side:252px;
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Pretendard Variable",system-ui,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C121D; --surface:#151E2C; --surface-2:#1B2536;
    --ink:#E8EDF5; --ink-2:#AEBACC; --ink-3:#8C99AE;
    --line:#2A3548; --brand:#5B93FF; --brand-soft:#17253D; --brand-ink:#9CC0FF;
  }
}
:root[data-theme="dark"]{
  --ground:#0C121D; --surface:#151E2C; --surface-2:#1B2536;
  --ink:#E8EDF5; --ink-2:#AEBACC; --ink-3:#8C99AE;
  --line:#2A3548; --brand:#5B93FF; --brand-soft:#17253D; --brand-ink:#9CC0FF;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden}
body.collapsed{grid-template-columns:0 1fr}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ── 인덱스 ── */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;z-index:2}
body.collapsed .side{border-right:0}
.shead{padding:18px 18px 12px;flex:none;min-width:var(--side)}
.brand{font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--brand)}
.brand small{display:block;font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-top:1px}
.seg{margin:0 18px 10px;display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none;min-width:calc(var(--side) - 36px)}
.seg button{border-radius:7px;padding:6px 0;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(19,28,46,.12)}
.list{flex:1;overflow-y:auto;padding:4px 10px 16px;min-width:var(--side)}
.grp{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:14px 8px 6px}
.grp:first-child{padding-top:6px}
.grp{display:flex;justify-content:space-between;gap:8px}
.grp span{font-weight:500;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:10px;padding:9px 10px;margin:1px 0}
@media (hover:hover){.item:hover{background:var(--surface-2)}}
.item[aria-current="page"]{background:var(--brand-soft)}
.item .v{font-weight:700;font-size:14px;min-width:42px;font-variant-numeric:tabular-nums}
.item[aria-current="page"] .v{color:var(--brand-ink)}
.item .meta{display:flex;flex-direction:column;min-width:0;flex:1}
.item .meta b{font-weight:500;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.item .meta i{font-style:normal;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10.5px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:2px 7px;flex:none}
.item[aria-current="page"] .badge{background:var(--surface)}
.sfoot{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;flex:none;min-width:var(--side);display:flex;justify-content:space-between;gap:8px}
.sfoot a{color:var(--ink-2);text-decoration:none;font-weight:600}
.sfoot a:hover{color:var(--brand)}
.sfoot span{color:var(--ink-3)}

/* ── 여닫기 ── */
.toggle{position:fixed;left:calc(var(--side) - 46px);top:15px;z-index:3;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  transition:left .22s cubic-bezier(.32,.72,0,1)}
@media (hover:hover){.toggle:hover{background:var(--surface-2)}}
body.collapsed .toggle{left:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(19,28,46,.12)}
.toggle svg{width:18px;height:18px}

.frame{position:relative;min-width:0}
iframe{border:0;width:100%;height:100%;display:block;background:var(--ground)}

/* 좁은 화면 — 인덱스는 위에 겹쳐 열고, 처음엔 닫아 둔다 */
@media (max-width:760px){
  body,body.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,var(--side));box-shadow:0 0 40px rgba(19,28,46,.25);transition:transform .25s cubic-bezier(.32,.72,0,1)}
  body.collapsed .side{transform:translateX(-102%);box-shadow:none}
  .shead,.list,.sfoot,.seg{min-width:0}
  .toggle,body.collapsed .toggle{left:auto;right:12px}
}
@media (prefers-reduced-motion:reduce){.toggle,.side{transition:none}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="버전 목록">
  <div class="shead"><div class="brand">KNEWIT<small>인터랙티브 프로토타입</small></div></div>
  <div class="seg" role="tablist" aria-label="정렬 기준">
    <button role="tab" data-by="ver" aria-selected="true">버전별</button>
    <button role="tab" data-by="sprint" aria-selected="false">스프린트별</button>
  </div>
  <nav class="list" id="list"></nav>
  <div class="sfoot"><span id="count"></span><a id="newtab" href="#" target="_blank" rel="noopener">새 탭에서 열기 ↗</a></div>
</aside>
<button class="toggle" id="toggle" aria-controls="side" aria-expanded="true" aria-label="버전 목록 닫기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
</button>
<main class="frame"><iframe id="view" title="KNEWIT 프로토타입"></iframe></main>

<script>
/* 버전 목록 — 새 버전을 올리면 v/ 폴더에 파일을 넣고 여기 한 줄을 추가한다 (위가 최신).
   sprint는 다음 스프린트로 넘어가기 전까지 같은 번호를 쓴다 */
const VERSIONS=[
  {v:"3.8", sprint:2, date:"2026-11-02", file:"v/3.8.html", note:"화면 44개 · BE 검토 반영"},
  {v:"3.7", sprint:2, date:"2026-11-02", file:"v/3.7.html", note:"화면 44개"},
  {v:"3.6", sprint:2, date:"2026-11-02", file:"v/3.6.html", note:"화면 41개"},
  {v:"3.4", sprint:2, date:"2026-11-01", file:"v/3.4.html", note:"화면 35개"}
];

const $=s=>document.querySelector(s);
const store={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
const narrow=()=>matchMedia("(max-width:760px)").matches;
const short=d=>d.replace(/-/g,".");
const latest=VERSIONS[0].v, curSprint=Math.max(...VERSIONS.map(x=>x.sprint));
let by=store.get("knewit.by")==="sprint"?"sprint":"ver", cur=null;

function item(x,showDate){
  return `<button class="item" data-v="${x.v}"${x.v===cur?' aria-current="page"':""}>
    <span class="v">v${x.v}</span>
    <span class="meta"><b>${showDate?short(x.date):x.note||""}</b>${showDate&&x.note?`<i>${x.note}</i>`:""}</span>
    ${x.v===latest?'<span class="badge">최신</span>':""}</button>`;
}
function renderList(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.by===by)));
  let html="";
  if(by==="ver"){
    html=[...VERSIONS].sort((a,b)=>b.v.localeCompare(a.v,undefined,{numeric:true})).map(x=>item(x,true)).join("");
  }else{
    const groups={};
    VERSIONS.forEach(x=>(groups[x.sprint]=groups[x.sprint]||[]).push(x));
    html=Object.keys(groups).map(Number).sort((a,b)=>b-a).map(n=>{
      const vs=groups[n], ds=vs.map(x=>x.date).sort(), span=ds[0]===ds[ds.length-1]?short(ds[0]):`${short(ds[0])} – ${short(ds[ds.length-1]).slice(5)}`;
      return `<div class="grp">스프린트 ${n}${n===curSprint?" · 진행 중":""}<span>${span}</span></div>`+vs.map(x=>item(x,true)).join("");
    }).join("");
  }
  $("#list").innerHTML=html;
  $("#count").textContent=`버전 ${VERSIONS.length}개`;
}
function show(v,push){
  const x=VERSIONS.find(y=>y.v===v)||VERSIONS[0];
  if(cur!==x.v){ cur=x.v; $("#view").src=x.file; }
  $("#newtab").href=x.file;
  document.title=`KNEWIT 프로토타입 v${x.v}`;
  if(push&&location.hash!=="#v"+x.v) history.pushState(null,"","#v"+x.v);
  renderList();
}
function setOpen(on){
  document.body.classList.toggle("collapsed",!on);
  const t=$("#toggle"); t.setAttribute("aria-expanded",String(on)); t.setAttribute("aria-label",on?"버전 목록 닫기":"버전 목록 열기");
  if(!narrow()) store.set("knewit.side",on?"1":"0");
}

$(".seg").addEventListener("click",e=>{const b=e.target.closest("button[data-by]"); if(!b) return; by=b.dataset.by; store.set("knewit.by",by); renderList();});
$("#list").addEventListener("click",e=>{const b=e.target.closest(".item"); if(!b) return; show(b.dataset.v,true); if(narrow()) setOpen(false);});
$("#toggle").addEventListener("click",()=>setOpen(document.body.classList.contains("collapsed")));
addEventListener("popstate",()=>show(location.hash.replace(/^#v/,""),false));

setOpen(narrow()?false:store.get("knewit.side")!=="0");
show(location.hash.replace(/^#v/,"")||latest,false);
</script>
</body>
</html>
