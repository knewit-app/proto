    <line class="artery" x1="${(W*0.3+S.px).toFixed(1)}" y1="${-H}" x2="${(W*0.42+S.px).toFixed(1)}" y2="${H*2}"/>
    ${dots}
    ${vis(mx,my)?meMark(mx,my):""}
    ${fmarks}
    ${pins}
  </svg>`;
}

/* 지도 조작 — 휠/드래그/핀치/버튼. 핀 크기는 배율과 무관하게 유지한다(실제 지도 관습). */
let mapMoved=false;
/* 확대/축소 버튼 — 한 번에 뛰지 않고 250ms 동안 부드럽게 */
function tweenZoom(z){
  if(RM()){ setZoom(z,MAPC.CX,MAPC.CY); return; }
  const z0=S.z, t0=performance.now(), D=250, ease=t=>1-Math.pow(1-t,3);
  (function f(now){ const t=Math.min(1,(now-t0)/D); setZoom(z0*Math.pow(z/z0,ease(t)),MAPC.CX,MAPC.CY); if(t<1) requestAnimationFrame(f); })(t0);
}
let inertia=0;
function setZoom(z,ax,ay){
  // 내 장소는 서울 전역까지 빠진다(동네 간 최대 130단위=13km). 홈은 동네 스케일에 묶는다.
  const onPlaces=S.screen==="S-PLS-01";
  const nz=Math.max(onPlaces?0.045:0.5,Math.min(3,z));
  const k=nz/S.z;
  if(ax!=null){
    S.px=(ax-MAPC.CX)*(1-k)+S.px*k;
    S.py=(ay-MAPC.CY)*(1-k)+S.py*k;
  }
  S.z=nz; redrawMap();
}
function redrawMap(){
  const old=document.querySelector(".bigmap"); if(!old) return;
  const wrap=document.createElement("div");
  wrap.innerHTML=currentMapSvg();
  old.replaceWith(wrap.firstElementChild);
  bindMap();
}
function bindMap(){
  const svg=document.querySelector(".bigmap"); if(!svg||svg.dataset.bound) return;
  svg.dataset.bound="1";
  const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*MAPC.H/r.height};};
  svg.addEventListener("wheel",e=>{e.preventDefault();const q=pt(e);setZoom(S.z*Math.exp(-e.deltaY*0.0018),q.x,q.y);},{passive:false});
  let drag=null,pinch=null;
  svg.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch"&&pinch) return;
    // 포인터 캡처는 실제 드래그가 시작된 뒤에만 건다 — pointerdown에서 걸면
    // pointerup 타깃이 svg로 바뀌고, click이 공통 조상(svg)에 떨어져 핀 탭이 사라진다
    cancelAnimationFrame(inertia);
    drag={x:e.clientX,y:e.clientY,px:S.px,py:S.py,d:0,id:e.pointerId,cap:false,lx:e.clientX,ly:e.clientY,lt:e.timeStamp,vx:0,vy:0};
    mapMoved=false;svg.classList.add("grabbing");
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag) return;
    const r=svg.getBoundingClientRect(),sc=390/r.width;
    const dx=(e.clientX-drag.x)*sc, dy=(e.clientY-drag.y)*sc;
    drag.d=Math.max(drag.d,Math.abs(dx)+Math.abs(dy));
    // 임계 이하의 흔들림에는 다시 그리지 않는다 — 다시 그리면 누르던 핀이 교체돼 탭이 사라진다
    if(drag.d<=5) return;
    if(!drag.cap){drag.cap=true;try{svg.setPointerCapture(drag.id);}catch(_){}}
    mapMoved=true;
    const dt=e.timeStamp-drag.lt; if(dt>0){ drag.vx=(e.clientX-drag.lx)*sc/dt; drag.vy=(e.clientY-drag.ly)*sc/dt; drag.lx=e.clientX; drag.ly=e.clientY; drag.lt=e.timeStamp; }
    S.px=drag.px+dx; S.py=drag.py+dy; redrawMap();
  });
  const end=()=>{
    if(drag&&drag.cap&&!RM()){ let vx=drag.vx*16, vy=drag.vy*16;   // px/프레임, 매 프레임 0.94배로 감속
      const glide=()=>{ if(Math.hypot(vx,vy)<.4) return; S.px+=vx; S.py+=vy; vx*=.94; vy*=.94; redrawMap(); inertia=requestAnimationFrame(glide); }; inertia=requestAnimationFrame(glide); }
    drag=null;svg.classList.remove("grabbing");};
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  svg.addEventListener("touchstart",e=>{
    if(e.touches.length===2){drag=null;
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      pinch={d:d,z:S.z};}
  },{passive:true});
  svg.addEventListener("touchmove",e=>{
    if(pinch&&e.touches.length===2){e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const r=svg.getBoundingClientRect(),sc=390/r.width;
      setZoom(pinch.z*d/pinch.d,
        ((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*sc,
        ((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*MAPC.H/r.height);
      mapMoved=true;}
  },{passive:false});
  svg.addEventListener("touchend",()=>{if(pinch)pinch=null;});
}

const ALL_MODES=["browse0","browse1","linked"];
const MODE_L={browse0:"구경 · 친구 없음",browse1:"구경 · 친구 있음",linked:"연결됨"};
const PRE_MODE=["S-INV-01","S-ONB-01","S-ONB-01a","S-ONB-02"];
const prfModes=v=>v==="guest"?null:v==="friend"?["browse1","linked"]:ALL_MODES;   // S-PRF-01 — 미가입은 모드 전          // 로그인 · 약관 — 아직 모드가 정해지지 않은 화면
/* 이 화면이 실제로 나올 수 있는 모드. null = 모드와 무관(온보딩 전) */
function modesFor(id,v){
  if(PRE_MODE.includes(id)) return null;
  if(id==="S-PRF-01") return prfModes(v||S.prf);
  if(["S-ONB-03","S-ONB-03a","S-ONB-04","S-ONB-04a"].includes(id)) return S.reauth?["linked"]:["browse0","browse1"];   // 아직 연결 전 · 재인증은 연결됨
  if(["S-MY-03","S-MY-03a","S-MY-03b","S-MY-03c","S-MY-03d"].includes(id)) return ["browse1","linked"];
  if(id==="S-MY-05f") return ["linked"];   // 연결된 카드가 있어야 해제
  if(id==="S-HOME-04b") return ["linked"];
  if(id==="S-PLC-01b") return ["linked"];   // 고칠 방문 기록이 있어야 열린다   // 친구가 있어야 열리는 친구 프로필
  if(["S-ONB-05","S-ONB-06","S-HOME-04","S-HOME-04a","OS-NOTI"].includes(id)) return ["linked"]; // 결제내역이 있어야 나옴
  if(id==="S-CMN-01") return ({sync:["linked"],reauth:["linked"],dormant:["linked"],nomatch:["linked"],novisit:["browse0","browse1"],nofriend:["browse0"],noreco:ALL_MODES})[v||S.err]||ALL_MODES;
  return ALL_MODES;
}

function varOn(id,v){
  if(id==="S-HOME-01") return v==="moved"?!S.areaAuto:(!!S.areaAuto&&(v==="friends"?S.homeSeg==="friends":S.homeSeg!=="friends"));
  if(id==="S-ONB-01a") return v==="fail"||v==="pin"?S.appleFace===v:(S.appleUser===v&&!S.appleFace);
  if(id==="S-ONB-04") return v==="fail1"?S.authErr==="wrong":v==="fail2"?S.authErr==="lockrisk":!S.authErr;
  if(id==="S-PLS-01") return S.placesFilter===v;
  if(id==="S-CMN-01") return S.err===v;
  return false;
}

function pins(){
  document.querySelectorAll(".fnpin").forEach(e=>e.remove());
  if(!S.pins) return;
  const map={"S-HOME-01":[[".sheetchips","FN-RE-040",-9],[".homesheet","FN-RE-100",-9],[".qpill","FN-SY-080",34]],
    "S-HOME-04":[[".pick","FN-SY-081",-9]],"S-PLC-01":[[".card","FN-PL-020",-9]],
    "S-PLS-01":[[".chips","FN-PL-050",-9]],"S-MY-01":[[".card","FN-TA-010",-9]]};
  const rules=map[S.screen]||[];
  const host=$("#screen"); if(!host) return;
  rules.forEach(([sel,id,dy])=>{
    const el=host.querySelector(sel); if(!el) return;
    const tag=document.createElement("div");
    tag.className="fnpin";tag.textContent=id;
    tag.style.left=el.offsetLeft+"px";tag.style.top=(el.offsetTop+dy)+"px";
    host.appendChild(tag);
  });
}

/* 바텀시트 드래그 — 헤더를 끌어 정지점 사이를 오간다(네이버 지도식) */
let sheetDragged=false;
function bindSheets(){
  document.querySelectorAll(".homesheet.drag").forEach(sh=>{
    if(sh.dataset.bound) return;
    sh.dataset.bound="1";
    const which=sh.dataset.sheet;
    const stops=which==="places"?[SHEET_PLS.peek,SHEET_PLS.full]:[SHEET_HOME.peek,SHEET_HOME.mid,SHEET_HOME.full];
    sh.dataset.state=(which==="places"?S.placesSheet:S.homeSheet);
    const heads=[...sh.querySelectorAll(".sgrip,.hshead")]; if(!heads.length) return;
    let d=null;
    const end=()=>{
      if(!d) return;
      const moved=d.moved>5, h=sh.offsetHeight, d0h=d.h, v=d.v||0;
      sh.classList.remove("dragging"); d=null;
      if(!moved){                        // 움직이지 않았으면 탭 — click 핸들러가 토글한다
        sh.style.height=(which==="places"?SHEET_PLS[S.placesSheet]:SHEET_HOME[S.homeSheet])+"px";
        return;
      }
      // 드래그 방향을 따라 간다 — 조금만 끌어도 반대쪽 정지점으로 넘어가게(두 정지점일 때)
      const dirStop=Math.abs(v)>0.5?(v<0?(stops.find(x=>x>h+8)||stops[stops.length-1]):([...stops].reverse().find(x=>x<h-8)||stops[0]))
        :stops.length===2?(h>d0h+24?stops[1]:h<d0h-24?stops[0]:null):null;   // 빠르게 튕기면 그 방향 다음 정지점
      const near=dirStop!==null?dirStop:stops.reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a,stops[0]);
      haptic("selection");
      const key=near===stops[stops.length-1]?"full":(near===stops[0]?"peek":"mid");
      if(which==="places") S.placesSheet=key; else S.homeSheet=key;
      render();
    };
    heads.forEach(head=>{
      head.addEventListener("pointerdown",e=>{
        d={y:e.clientY,h:sh.offsetHeight,moved:0,ly:e.clientY,lt:e.timeStamp,v:0}; sheetDragged=false;
        sh.classList.add("dragging");
        try{head.setPointerCapture(e.pointerId);}catch(_){}
      });
      head.addEventListener("pointermove",e=>{
        if(!d) return;
        const dy=(d.y-e.clientY)/PZ;
        d.moved=Math.max(d.moved,Math.abs(dy));
        if(d.moved>5) sheetDragged=true;
        const dt=e.timeStamp-d.lt; if(dt>0){ d.v=(e.clientY-d.ly)/PZ/dt; d.ly=e.clientY; d.lt=e.timeStamp; }
        let h=d.h+dy; const lo=stops[0], hi=stops[stops.length-1];
        if(h>hi) h=hi+(h-hi)*.35; if(h<lo) h=lo-(lo-h)*.35;   // 끝에서는 고무줄처럼 버틴다
        sh.style.height=h+"px";
      });
      head.addEventListener("pointerup",end);
      head.addEventListener("pointercancel",end);
    });
  });
}
