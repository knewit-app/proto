<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KNEWIT 기능 명세 70건 · 화면 41건 인터랙티브 프로토타입">
<title>KNEWIT 프로토타입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --ground:#EEF1F6; --grid:#E2E7EF;
  --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#EBEFF5;
  --ink:#131C2E; --ink-2:#3D4A61; --ink-3:#5C6879;
  --line:#D8DFE9; --line-soft:#E7ECF3;
  --new:#2F6FEB; --new-soft:#E4EDFD; --new-ink:#1B4FB0;     /* NEW IT — 메인 파랑 */
  --knew:#3D4A61; --knew-soft:#EBEFF5; --knew-ink:#131C2E;  /* KNEW IT — 무채색 */
  --alert:#A8271D; --alert-soft:#F8E4E2;
  --brand:#2F6FEB; --brand-soft:#E4EDFD;   /* KNEWIT 메인 — 추천 · 로고마크 */
  --me:#0A84FF; --me-soft:#E1F0FF;         /* 내 위치 전용 (시스템 파랑, 메인보다 밝게) */
  --shadow:0 1px 2px rgba(19,28,46,.06),0 12px 32px rgba(19,28,46,.10);
  --shadow-phone:0 2px 6px rgba(19,28,46,.10),0 40px 80px rgba(19,28,46,.22);
  --r:14px;
  --ease:cubic-bezier(.25,.1,.25,1);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  /* 전 요소 Pretendard — 로컬 설치본 → CDN → 시스템 한글 폰트 순으로 폴백 */
  --f-stack:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Apple SD Gothic Neo",Pretendard,"Pretendard Variable",system-ui,
            'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Roboto,sans-serif;
  --f-display:var(--f-stack);
  --f-body:var(--f-stack);
  --f-mono:var(--f-stack);
  --glass:rgba(255,255,255,.66);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.45),0 0 0 .5px rgba(19,28,46,.14),0 8px 24px rgba(19,28,46,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C121D; --grid:#151E2C;
    --surface:#151E2C; --surface-2:#1B2536; --surface-3:#222E42;
    --ink:#E8EDF5; --ink-2:#AEBACC; --ink-3:#8C99AE;
    --line:#2A3548; --line-soft:#212B3C;
    --new:#5B93FF; --new-soft:#17253D; --new-ink:#9CC0FF;
    --knew:#AEBACC; --knew-soft:#222E42; --knew-ink:#E8EDF5;
    --alert:#E58179; --alert-soft:#331A18;
    --brand:#5B93FF; --brand-soft:#17253D; --me:#6E9DF5; --me-soft:#16233B;
    
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    --shadow-phone:0 2px 6px rgba(0,0,0,.5),0 40px 80px rgba(0,0,0,.6);
    --glass:rgba(40,44,52,.62);
    --glass-sh:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.10),0 0 0 .5px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0C121D; --grid:#151E2C;
  --surface:#151E2C; --surface-2:#1B2536; --surface-3:#222E42;
  --ink:#E8EDF5; --ink-2:#AEBACC; --ink-3:#8C99AE;
  --line:#2A3548; --line-soft:#212B3C;
  --new:#5B93FF; --new-soft:#17253D; --new-ink:#9CC0FF;
  --knew:#AEBACC; --knew-soft:#222E42; --knew-ink:#E8EDF5;
  --alert:#E58179; --alert-soft:#331A18;
  --brand:#5B93FF; --brand-soft:#17253D; --me:#6E9DF5; --me-soft:#16233B;
  --glass:rgba(40,44,52,.62);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.10),0 0 0 .5px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --shadow-phone:0 2px 6px rgba(0,0,0,.5),0 40px 80px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--new);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pinn,.sm,table.trace td.num,.step .val,.step .cut,.field,.reco .meta,.arearow .tag{font-variant-numeric:tabular-nums}

/* ── workbench ── */
.wrap{max-width:1280px;margin:0 auto;padding:26px 22px 60px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.brandline{display:flex;align-items:baseline;gap:12px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:.04em;color:var(--brand)}
.masthead p{margin:4px 0 0;color:var(--ink-3);font-size:12.5px;max-width:52ch}
.eyebrow{font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mh-tools{display:flex;gap:8px;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-2);transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease),transform .14s var(--ease-out)}@media (hover:hover) and (pointer:fine){.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}}

.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}

/* ── phone ── */
.deck{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.phone{width:390px;height:800px;background:var(--surface);border-radius:46px;box-shadow:var(--shadow-phone);
  border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.phone.privacy::after{content:"";position:absolute;inset:0;z-index:60;background:color-mix(in srgb,var(--surface) 35%,transparent);backdrop-filter:blur(22px) saturate(.8);-webkit-backdrop-filter:blur(22px) saturate(.8);border-radius:inherit}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:29px;background:#0A0F18;border-radius:20px;z-index:40}
.statusbar{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 4px;font-size:12px;font-weight:600;color:var(--ink);flex:none}
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
.viewport::-webkit-scrollbar{width:0}
.phone{--dt:1;--t-c2:calc(11px*var(--dt));--t-c1:calc(12px*var(--dt));--t-fn:calc(13px*var(--dt));--t-sub:calc(15px*var(--dt));
  --t-call:calc(16px*var(--dt));--t-body:calc(17px*var(--dt));--t-t3:calc(20px*var(--dt));--t-t2:calc(22px*var(--dt));--t-t1:calc(28px*var(--dt));--t-lg:calc(34px*var(--dt))}
.recorow .rn b,.listrow .nm,.pr-t b,.srow .sn b,.reco .nm{font-size:var(--t-body)!important;font-weight:600}
.screen{font-size:var(--t-sub);padding:6px 20px 26px;animation:in .2s var(--ease-out) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.tabbar{flex:none;height:74px;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:14px;background:var(--surface)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--t-c2);letter-spacing:0;color:var(--ink-3);font-weight:600}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar svg{display:block}

/* ── app type ── */
.nav{display:flex;align-items:center;gap:10px;min-height:34px;margin-bottom:14px}
.nav button{font-size:var(--t-fn);color:var(--ink-3)}
.h1{font-family:var(--f-display);font-size:var(--t-t1);font-weight:700;letter-spacing:-.022em;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.h2{font-size:var(--t-sub);font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:var(--t-fn);margin:0 0 18px;line-height:1.6}
/* 프로필 — 사람 → 칭호 → 구성 → 하루 → 동네. 숫자 타일 대신 모양으로 말한다. */
.mehead{display:flex;align-items:center;gap:13px;margin:6px 0 0}
.mehead .meava{width:52px;height:52px;font-size:var(--t-t3);background:var(--ink);color:var(--surface)}
.me-id{display:flex;flex-direction:column;gap:2px}
.me-id b{font-size:var(--t-body);font-weight:700;color:var(--ink)}
.me-id i{font-style:normal;font-size:var(--t-fn);color:var(--ink-3)}
.profhead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 16px}
.profhead .ava{width:76px;height:76px;font-size:var(--t-t1)}
.profhead .meava{background:var(--ink);color:var(--surface)}
.profhead h1{font-size:var(--t-t2);font-weight:700;letter-spacing:-.02em;margin:12px 0 2px;color:var(--ink)}
.profhead .handle{font-size:var(--t-fn);color:var(--ink-3)}
.profhead .bio{margin:12px 0 0;font-size:var(--t-call);font-weight:500;color:var(--ink-2);word-break:keep-all}
.profhead .bio b{font-weight:700;color:var(--ink)}
.profhead .counts{margin:6px 0 0;font-size:var(--t-fn);color:var(--ink-3)}
.profhead .counts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.profactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profactions .cta{height:40px;min-height:0;font-size:var(--t-sub);padding:0 10px}
.sheetseg.ptabs{margin:18px 0 0}
.ppanel{padding-top:14px}
.ptags{display:flex;flex-wrap:wrap;gap:8px}
.ptags+.ptags{margin-top:16px}
.ghosttags .chip{border-style:dashed;color:var(--ink-3)}
.ptags .chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-fn);padding:7px 13px}
.ptags .chip .ic{width:15px;height:15px}
.personrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid var(--line-soft)}
.pr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pr-t b{font-size:var(--t-sub);font-weight:600;color:var(--ink)}
.pr-t i{font-style:normal;font-size:var(--t-c1);color:var(--ink-3)}
.pr-r{flex:none;font-size:var(--t-c1);color:var(--ink-3)}
.profhead .counts .cnt{font:inherit;color:inherit;min-height:32px;padding:0 2px;position:relative}
.profhead .counts .cnt::before{content:"";position:absolute;inset:-6px -4px}
.sheetseg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(19,28,46,.14)}
.rk.hlic{color:var(--ink-3)}.rk.hlic .ic{width:16px;height:16px}
.textlink{display:inline-flex;margin-top:12px;font-size:var(--t-fn);font-weight:600;color:var(--ink-2);min-height:36px;align-items:center}
.metoo{color:var(--ink-2)!important;font-weight:600}
/* 내 취향 — 한 줄짜리 kv가 계속 이어지면 어디를 봐야 할지 안 보인다.
   요약 → 분포 → 지표 → 목록 순으로 밀도를 다르게 준다. */
.tastehero{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:16px;padding:18px 18px 14px}
.th-line{margin:0 0 15px;font-size:var(--t-t3);line-height:1.42;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.th-line b{font-weight:700}
.th-line .accent{color:var(--knew)}
.th-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:13px;border-top:1px solid var(--line)}
.th-stats>div{display:flex;flex-direction:column;gap:2px}
.th-stats em{font-style:normal;font-family:var(--f-mono);font-size:var(--t-t2);font-weight:600;color:var(--ink);line-height:1}
.th-stats em i{font-style:normal;font-size:var(--t-c1);color:var(--ink-3);margin-left:1px}
.th-stats span{font-size:var(--t-c1);color:var(--ink-3)}
.typerow{display:flex;align-items:center;gap:11px}
.typerow .tr-n{font-size:var(--t-fn);min-width:104px;color:var(--ink-2);display:flex;flex-direction:column;gap:1px}
.typerow.lead .tr-n{font-weight:600;color:var(--ink)}
.typerow .tr-sub{font-style:normal;font-size:var(--t-c2);color:var(--ink-3)}
.typerow .bar{flex:1;height:7px}
.typerow.lead .bar{height:9px}
.typerow .tr-p{font-size:var(--t-c2);color:var(--ink-3);width:38px;text-align:right}
.typerow.lead .tr-p{color:var(--ink);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid>div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:12px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.statgrid span{font-size:var(--t-c1);color:var(--ink-3)}
.statgrid b{font-size:var(--t-sub);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anchorrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;background:var(--surface)}@media (hover:hover) and (pointer:fine){.anchorrow:hover{border-color:var(--ink-3)}}

.ar-rank{flex:none;width:22px;height:22px;border-radius:7px;background:var(--surface-3);color:var(--ink-3);
  font-family:var(--f-mono);font-size:var(--t-c2);font-weight:600;display:flex;align-items:center;justify-content:center}
.ar-rank.top{background:var(--knew);color:var(--surface)}
.ar-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ar-body b{font-size:var(--t-sub);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar-body i{font-style:normal;font-size:var(--t-c2);color:var(--ink-3)}
.ar-n{flex:none;font-size:var(--t-sub);font-weight:600;color:var(--ink)}
.ar-n i{font-style:normal;font-size:var(--t-c2);color:var(--ink-3);margin-left:1px}
/* 장소 상세 — 제목 옆 별로 저장, 주요 버튼은 길찾기·공유 */
.pdhead{margin-top:2px}
.pdtitle{display:flex;align-items:flex-start;gap:10px}
.pdtitle .h1{flex:1;min-width:0}
.starbtn{flex:none;width:40px;height:40px;border-radius:50%;font-size:var(--t-t2);line-height:1;
  color:var(--ink-3);margin-top:-4px}@media (hover:hover) and (pointer:fine){.starbtn:hover{background:var(--surface-2);color:var(--ink-2)}}

.starbtn.on{color:var(--knew)}
.pdmeta{margin:7px 0 0;font-size:var(--t-fn);color:var(--ink-2)}
.pdtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.openflag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;
  font-size:var(--t-c2);font-weight:600;background:var(--surface-2);color:var(--ink-3)}
.openflag.on{color:var(--ink)}
.whybox{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--surface-2)}
.pdwhy{margin:8px 0 0;font-size:var(--t-sub);line-height:1.6;color:var(--ink-2)}
.pdwhy b{color:var(--ink);font-weight:600}
.morelink{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  padding:11px 0 4px;font-size:var(--t-fn);font-weight:600;color:var(--ink-3)}@media (hover:hover) and (pointer:fine){.morelink:hover{color:var(--ink-2)}}

.morelink i{font-style:normal;font-size:var(--t-c2)}
.addbtn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:999px;
  background:var(--ink);color:var(--surface);font-size:var(--t-fn);font-weight:600;flex:none}
.addbtn span{font-size:var(--t-sub);line-height:1}@media (hover:hover) and (pointer:fine){.addbtn:hover{opacity:.9}}

/* 편의 정보 — 아이콘 + 라벨 가로 행. 있음은 채워진 원, 없음은 흐리게, 미확인은 점선. */
.facrow{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.facrow::-webkit-scrollbar{display:none}
.fac{display:flex;flex-direction:column;align-items:center;gap:7px;flex:none;min-width:56px}
.fac .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--ink-3);background:var(--surface)}
.fac .fl{font-size:var(--t-c2);color:var(--ink-3);white-space:nowrap}
.fac.yes .ic{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fac.yes .fl{color:var(--ink);font-weight:600}
.fac.no{opacity:.42}
.fac.unk .ic{border-style:dashed}
.openhours{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.ohcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.ohcol .ohbar{height:26px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.ohcol .ohbar i{display:block;width:100%;border-radius:4px;background:var(--ink-3)}
.ohcol span{font-size:var(--t-c2);color:var(--ink-3)}
.ohcol.now .ohbar i{background:var(--new)}
.ohcol.now span{color:var(--ink);font-weight:600}
.sectionlabel{font-size:var(--t-c1);letter-spacing:-.005em;color:var(--ink-3);font-weight:600;margin:26px 0 10px}
.sectionlabel:first-child{margin-top:4px}

.cta{display:block;width:100%;background:var(--ink);color:var(--surface);border-radius:12px;padding:14px;font-size:var(--t-sub);font-weight:600;text-align:center;transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease),transform .14s var(--ease-out)}@media (hover:hover) and (pointer:fine){.cta:hover{opacity:.88}}

.cta[disabled]{opacity:.3;cursor:not-allowed}
.cta.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:9px}
.row>*{flex:1}

.card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px}
.pick{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;
  display:flex;align-items:center;gap:11px;text-align:left;width:100%;transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease),transform .14s var(--ease-out);font-size:var(--t-sub)}@media (hover:hover) and (pointer:fine){.pick:hover{border-color:var(--ink-3)}}

.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.pick .tick{margin-left:auto;font-size:var(--t-c1);color:var(--ink-3)}
.pick[aria-pressed="true"] .tick{color:var(--new)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:var(--t-c1);color:var(--ink-2);background:var(--surface);transition:border-color .16s var(--ease),background-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease),transform .14s var(--ease-out)}@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--ink-3)}}

.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.maplegend2 button{font-size:var(--t-c2);color:var(--ink-3);display:inline-flex;align-items:center;padding:1px 2px;border-radius:5px}

/* 하단 버튼 (COM-21, v3.10.1) — 한 단계를 끝내거나 다음으로 넘기는 주 버튼 영역. 화면은 세로 flex · 높이 100%,

<script>
(function(){
"use strict";

/* ═══════════ 데이터 ═══════════ */
/* ax·ay = 서울 실제 상대 위치(단위 100m, 연남동 원점 · 동 +x / 북 +y).
   운영에서는 네이버 지도 SDK가 위경도를 받아 그리므로 이 값은 목업 전용 좌표다.
   POI의 p.x·p.y는 동네 내부 로컬 좌표이고, 지도에 찍히는 값은 anchor + local 이다. */
const AREAS={
  yeonnam:{name:"연남동",gu:"마포구",anchor:true,label:"집 생활권",open:true,ax:0,ay:0},
  gangnam:{name:"강남역",gu:"강남구",anchor:true,label:"직장 생활권",open:true,ax:90,ay:-72},
  seongsu:{name:"성수동",gu:"성동구",anchor:false,label:"생활권 밖",open:true,ax:115,ay:-20},
  mangwon:{name:"망원동",gu:"마포구",anchor:false,label:"생활권 밖",open:true,ax:-17,ay:-7},
  euljiro:{name:"을지로",gu:"중구",anchor:false,label:"생활권 밖",open:true,ax:58,ay:4}
};
/* 전역 좌표 — 내 장소 지도처럼 여러 동네를 한 화면에 놓을 때 쓴다.
   홈 추천은 "그 동네에 있다"는 전제라 로컬 dist()를 그대로 쓴다. */
const gx=p=>AREAS[p.area].ax+p.x, gy=p=>AREAS[p.area].ay+p.y;
const gdist=p=>Math.hypot(gx(p),gy(p))*100;
/* 이 배율 아래에서는 개별 핀을 접고 동네 클러스터로 바꾼다 (네이버·카카오 지도와 같은 동작) */
const ZCLUSTER=0.45;
// 서울 순차 오픈 — POI 원장 커버리지가 확보되면 열린다 (NFR-1.11)

/* 영업 정보는 외부 데이터(공식 영업시간)만 쓴다 — 결제 시간대로 추정하지 않는다 (v3.7).
   외부 데이터가 없는 곳은 '영업 정보 없음'이고, '지금 영업중' 조건을 켜면 기본으로 뺀다 */
const SLOT_HOUR=[9,12,15,19,23];   // 시간대 칩의 대표 시각
const slotOfHour=h=>h>=5&&h<11?0:h>=11&&h<14?1:h>=14&&h<17?2:h>=17&&h<22?3:4;
const nowSlot=()=>slotOfHour(new Date().getHours());
const DOWS="일월화수목금토";
const HOURS_BY_G={"카페":[9,22],"음식점":[11,22],"술집":[17,26],"기타":[11,20]};
/* 외부 영업시간 (흉내) — 세 곳 중 한 곳은 정보 없음. 식당 절반은 브레이크타임 15~17시, 연남 방앗간은 월요일 휴무 (v3.8) */
const BAR26=(POIS.filter((p,i)=>i%3!==2).find(p=>p.g==="술집")||{}).id;
const HOURS=Object.fromEntries(POIS.filter((p,i)=>i%3!==2).map((p,i)=>{ const h=HOURS_BY_G[p.g]||[11,21];
  return [p.id,{o:h[0],c:h[1],brk:p.g==="음식점"&&i%2===0?[15,17]:null,off:p.id==="p02"||p.id===BAR26?1:null}]; }));   // BAR26: 월요일 휴무 술집 — 일요일 밤 26시까지 (v3.10 UC-62)
function openAt(p,h,dow){ const x=HOURS[p.id]; if(!x) return {s:0};
  if(x.c>24&&h<x.c-24&&h<x.o){ const pd=(dow+6)%7;   // 자정부터 마감까지는 전날 영업 일정으로 판단 (v3.10 UC-62)
    return x.off===pd?{s:-1,why:`${DOWS[pd]}요일 휴무`}:{s:1}; }
  if(x.off===dow) return {s:-1,why:`${DOWS[dow]}요일 휴무`};
  if(!(h>=x.o&&h<x.c)) return {s:-1};
  if(x.brk&&h>=x.brk[0]&&h<x.brk[1]) return {s:-1,why:`브레이크타임 ${x.brk[0]}~${x.brk[1]}시`};
  return {s:1}; }
const clockH=d=>d.getHours()+d.getMinutes()/60;
/* 세부 조건 — 현재 시간대면 기기 시각, 다른 시간대를 고르면 그 시간대 대표 시각으로 판단한다 */
function openState(p){ const d=new Date(); return openAt(p,S.slot===nowSlot()?clockH(d):SLOT_HOUR[S.slot],d.getDay()).s; }   // 1 영업중 · -1 영업 시간 아님 · 0 정보 없음
/* 장소 상세 — 시간대 칩과 관계없이 항상 기기의 현재 시각 */
const openNow=p=>{ const d=new Date(); return openAt(p,clockH(d),d.getDay()); };
const openLabel=()=>S.slot===nowSlot()?"지금 영업중":`${SLOTS[S.slot]}에 영업중`;
const attrOf=p=>ATTRS[p.id];
function attrHit(p,k){
  if(k==="open") return openState(p);
  const a=attrOf(p);
  if(!a) return 0;              // 0 = 정보 없음
  return a.includes(k)?1:-1;
}

function fTaste(f){
  const w={};let tot=0;
  visibleFriendPlaces(f).map(x=>[x.p.id,x.n]).forEach(([id,n])=>{   // 친구가 공개한 범위만 — 비공개 친구의 취향은 계산하지 않는다 (v3.4.3)
    const p=byId(id);if(!p)return;
    const outside=p.area===f.home?1:1.7, fr=p.fr?0.35:1;
    const x=Math.log2(n+1)*outside*fr;
    w[p.cat]=(w[p.cat]||0)+x;tot+=n;
  });
  return{w,visits:tot};
}
// Taste Match = 카테고리 분포 코사인 × 데이터 충분성
function tasteMatch(f){
  const me=taste().raw, ft=fTaste(f).w;
  const keys=[...new Set([...Object.keys(me),...Object.keys(ft)])];
  let dot=0,a=0,b=0;
  keys.forEach(k=>{const x=me[k]||0,y=ft[k]||0;dot+=x*y;a+=x*x;b+=y*y;});
  const cos=(a&&b)?dot/Math.sqrt(a*b):0;
  const suff=Math.min(fTaste(f).visits/16,1);
  return{match:cos,suff,trust:cos*suff};
}

function logConsent(k,what){ S.consentLog=(S.consentLog||[]).concat([{k,what,at:`${today()} ${hhmm(SRV.now())}`}]); }   // 동의 내역 — 철회 · 재동의 일시 (v3.10)
const acceptTxt=()=>{ const k=shareOf(); return !S.linked||k==="none"?"친구가 됐어요 · 내 장소는 안 보여요":`친구가 됐어요 · 내 장소 ${API.sharePreview(k).visibleCount}곳이 보여요`; };
/* 초대 가입 — 초대자가 안 보여주기거나 공개 장소가 0곳이면 추천 세그먼트로 시작한다 (v3.7) */
const inviter=()=>FRIENDS0[0];
const inviterOpen=()=>{ const f=inviter(); return !!f&&visibleFriendPlaces(f).length>0; };
const inviterNote=()=>`${inviter().name}님은 아직 장소를 공개하지 않았어요`;
const FRIENDS0=FRIENDS.slice();
/* 친구가 가장 많이 간 동네 — 한 명만 보기를 켰는데 지금 동네에 기록이 없으면 그리로 옮긴다 */
function friendBestArea(f){
  const c={}; visibleFriendPlaces(f).filter(x=>x.n>=FRIEND_MIN&&inScope(x.p)).forEach(x=>{c[x.p.area]=(c[x.p.area]||0)+1;});   // friendsHere와 같은 필터
  return {count:c, best:Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||null};
}
// 이 장소에 대한 친구 신호 — 반복 방문(2회 이상)만, 신뢰도 가중
function friendSignal(poiId){
  let v=0;const who=[];
  FRIENDS.forEach(f=>{
    const n=fVisit(f,poiId); if(n<FRIEND_MIN||!friendShareIds(f).has(poiId)) return;
    const{trust}=tasteMatch(f);
    v+=trust*Math.min(n/3,1);
    if(trust>=0.5) who.push({f,n,trust});
  });
  who.sort((a,b)=>b.trust-a.trust);
  return{v:Math.min(v,1),who};
}
function visibleFriendPlaces(f){
  return scopeRows(f.v.map(([id,n])=>({id,n})),f.share).map(r=>({p:byId(r.id),n:r.n})).filter(x=>x.p).sort((a,b)=>b.n-a.n);
}

/* 내 장소 탭의 친구 세그먼트 — 공개 범위를 지키되 동네·카테고리로 자르지 않는다.
   지도 전체가 하나의 좌표계이므로 친구 기록도 전부 한 화면에 놓인다. */
/* 저장은 폴더가 원본이고 S.saved는 조회용 파생 집합이다.
   장소 상세의 저장 토글은 기본 폴더(첫 번째)에 넣고 뺀다. */
function syncSaved(){
  S.saved=new Set();
  S.folders.forEach(f=>f.ids.forEach(id=>{ if(byId(id)) S.saved.add(id); }));
}
function folderOf(id){ return S.folders.find(f=>f.ids.includes(id))||null; }

/* 홈 친구 세그먼트 — 전체 친구를 현재 동네·카테고리 스코프로 자른다.
   추천과 같은 문맥(지금 여기)에서 보는 신호이므로 스코프를 공유한다. */
function friendsHere(){
  if(S.noFriends&&!S.linked) return [];
  const out={};
  FRIENDS.forEach(f=>{
    if(f.share==="none") return;
    const ok=friendShareIds(f);
    f.v.forEach(function(e){
      var id=e[0],n=e[1];
      if(!ok.has(id)||n<FRIEND_MIN) return;
      const p=byId(id); if(!p||!inBase(p)||!inScope(p)) return;
      if(!out[id]) out[id]={p:p,who:[]};
      out[id].who.push({f:f,n:n});
    });
  });
  return Object.keys(out).map(k=>out[k]).sort((a,b)=>b.who.length-a.who.length||dist(a.p)-dist(b.p));
}

function friendsAllPlaces(){
  const out={};
  FRIENDS.forEach(f=>{
    if(f.share==="none") return;
    const ok=friendShareIds(f);
    f.v.forEach(function(e){
      var id=e[0],n=e[1];
      if(!ok.has(id)||n<FRIEND_MIN) return;
      const p=byId(id); if(!p) return;
      if(!out[id]) out[id]={p:p,who:[]};
      out[id].who.push({f:f,n:n});
    });
  });
  return Object.keys(out).map(k=>out[k])
    .sort((a,b)=>{
      const s=(x)=>x.who.reduce((t,w)=>t+w.n,0);
      return b.who.length-a.who.length || s(b)-s(a);
    });
}

/* 홈 지도의 친구 레이어 — 친구의 공개 범위(FN-SE-020)를 그대로 따르고,
   1회 방문은 신호로 쓰지 않는다(COM-08과 동일 규칙). */
function friendLayerPlaces(){
  const out={};
  FRIENDS.filter(f=>f.id===S.friendLayer).forEach(f=>{
    if(f.share==="none") return;
    const ok=friendShareIds(f);
    f.v.forEach(function(e){
      var id=e[0],n=e[1];
      if(!ok.has(id)||n<FRIEND_MIN) return;                       // 공개 범위 + 반복 방문 규칙
      const p=byId(id); if(!p) return;
      if(!inBase(p)||!inScope(p)) return;       // 지금 보고 있는 기준점·카테고리만
      if(!out[id]) out[id]={p:p,who:[]};
      out[id].who.push({f:f,n:n});
    });
  });
  return Object.keys(out).map(function(k){return out[k];})
    .sort(function(a,b){return b.who.length-a.who.length;});
}

const SCREENS={
  "S-ONB-01":{n:"서비스 소개 · 로그인",fn:["FN-ON-010", "FN-ON-020"],note:"<b>로그인은 온보딩 전체에서 이 화면 한 번뿐</b>입니다. Apple은 iOS 시스템 시트(S-ONB-01a)를 거칩니다. <b>기존 회원</b>(로그아웃 · 로그인 만료 뒤)은 약관을 건너뛰고 원래 있던 곳으로 돌아갑니다(v3.10 추가분). 경로 선택은 로그인 뒤 카드사 선택 화면으로 옮겨, 구경하려는 사람이 카카오·Apple 버튼을 두 번 보지 않게 했습니다. <b>진입에 따라 첫 화면이 다릅니다</b> — 직접 설치는 서비스 소개가, 초대 링크는 초대한 친구가 먼저 보입니다. 상단 툴바의 ‘직접 설치 / 초대 링크 시작으로 건너뛰기’로 두 진입을 따로 확인할 수 있습니다."},
  "S-ONB-02":{n:"약관 동의 (서비스 공통)",fn:["FN-ON-030", "FN-SE-080", "COM-03"],note:"<b>모든 사용자에게 필요한 동의만</b> 받습니다 — 만 14세 이상 확인 · 서비스 약관(필수)과 광고 알림(선택). <b>위치 약관은 지도에 처음 들어갈 때 S-HOME-01b에서 한 번</b> 받습니다. 만 14세 미만은 가입할 수 없다는 안내만 두고, 약관 동의를 마치지 않은 가입은 24시간(<code>POLICY.signupTtlHours</code>) 뒤 소셜 계정 정보 · 세션을 자동으로 지웁니다. ‘다음’을 누르면 권한 안내 시트 없이 바로 카드사 선택으로 갑니다(v3.10 추가분). 결제내역 조회는 여기서 받지 않습니다. 선택으로 두면 동의하지 않은 사람은 어차피 연결할 수 없어 의미가 없고, 필수로 두면 둘러보기만 할 사람에게 필요 없는 수집을 강요하게 됩니다(개인정보보호법 제16조 3항). 그래서 결제 관련 동의는 <b>카드 연결 흐름 안의 별도 시트(S-ONB-03a)</b>로 분리했습니다."},
  "S-ONB-03":{n:"카드사 선택",fn:["FN-ON-040", "FN-ON-090", "FN-ON-045", "FN-SE-010"],note:"<b>v3.10.1: 14곳을 로고로 한 화면에</b> 보여 줍니다. 지원 6곳은 2열 큰 타일(로고 + 최근 N개월), 준비 중 8곳은 4열 작은 타일(흑백 · 흐리게)이고 누르면 ‘지원되면 알려 드릴게요’ 시트입니다. 카드사 추가로 들어오면 이미 연결한 카드사는 ‘연결됨’ 배지가 붙고 누를 수 없습니다. 카드사를 누르면 바로 다음 단계로 갑니다(v3.9.2). <b>‘다음’을 누르면 카드 연결 동의 시트(S-ONB-03a)</b>가 뜹니다. 결제내역 조회는 이 기능에 반드시 필요하므로 <b>시트 안에서는 필수</b>, 금액 수집만 선택입니다. 동의를 카드사 로그인 화면과 분리한 건 Plaid의 연결 흐름과 같은 순서입니다 — 데이터 권한 동의를 먼저 받고, 그 다음에 금융기관 로그인으로 넘어갑니다. 한 번 동의하면 다음부터는 시트 없이 바로 넘어갑니다. <b>경로가 갈라지는 화면</b>입니다. 둘러보기 선택지는 <b>‘다음’ 버튼 바로 위</b>에 텍스트 버튼으로 둡니다 — 카드사를 고르다 막힌 사람의 시선이 머무는 자리이고, 주 행동(다음)의 무게는 그대로 유지됩니다. 문구만 진입에 따라 달라집니다: 직접 설치는 ‘나중에 연결하고 둘러보기’, 초대로 온 사람은 ‘지수님 지도 먼저 둘러보기’. 구경으로 빠져도 이 화면을 한 번 본 상태라, 나중에 연결 제안을 받을 때 무엇이 필요한지 이미 압니다. CODEF 개인카드 승인내역 API 문서 기준으로 <b>문제가 확인되지 않은 6곳만</b> 우선 엽니다. 제외 사유 — <b>현대</b>: 아이디 로그인에 카드 비밀번호 인증 추가(25.10.30), 3회 오류 시 계정 잠김, 조회 3개월. <b>우리·제주</b>: 가맹점 정보 미제공이라 장소 매칭 불가. <b>씨티</b>: 아이디 로그인 시 SMS 추가 인증. <b>NH농협·수협·광주·전북</b>: 가맹점 정보 경로·필드가 달라 실측 후 추가. 포함 카드사 중 <b>신한</b>은 BC 로고가 있는 신한 체크카드만 가맹점 정보를 주지 않아, 선택 시 경고를 붙입니다. 로그인에 <b>생년월일은 받지 않습니다</b> — CODEF 카드 파라미터 시트상 생년월일은 우리카드(잠금 직전)와 인증서 자동등록에만 필요합니다. 비밀번호 오류 횟수는 삼성·신한·롯데만 CODEF가 알려줘서(userError, 5회 잠금) 그 셋은 횟수를 보여주고, KB·하나·BC는 알 수 없으니 2번째에서 멈춥니다. 하나·신한은 3개월 단위로 나눠 조회해 첫 불러오기에 구간을 표시하고, 삼성·신한은 결제 시각이 빠질 수 있어(resUsedTime △) 시간대 취향 계산에서 빠질 수 있습니다. KB·NH·수협·현대는 가맹점 옵션 '1'로는 주소·업종이 빠질 수 있어 서버에서 '3'(매출전표 포함)으로 조회해야 합니다. 오른쪽 기간은 카드사별 <b>조회 가능 기간</b>이고 첫 방문 요약의 범위가 됩니다. 준비 중 카드사의 ‘알림 받기’ 수는 다음 지원 카드사 우선순위로 씁니다. <b>v3.9.2: 한 화면</b> — 기준 기기(iPhone SE 375×667) 기본 글자 크기에서 스크롤 없이 보입니다. 카드사는 2열 타일이고 <b>누르면 바로</b> 동의 시트(처음) 또는 로그인으로 갑니다. ‘다음’ 버튼은 없앴습니다. 각주는 ‘본인 명의 개인카드만 · 준비 중인 카드사’ 한 줄이고, 신한 경고는 로그인 화면으로 옮겼습니다."},
  "S-ONB-04":{n:"카드사 홈페이지 로그인",fn:["FN-ON-045", "FN-ON-041", "FN-ON-042", "FN-ON-043"],note:"마찰이 가장 큰 화면이라 다섯 가지를 겁니다. ⓪이 화면에는 <b>동의 항목을 두지 않습니다</b>(S-ONB-03a에서 받음) — 입력과 아이디 찾기에만 집중하고, 끝까지 막히면 ‘나중에 연결할게요’로 앱을 떠나지 않고 구경 모드로 들어갑니다. ①제목과 부제에서 <b>앱 간편 비밀번호가 아니라 홈페이지 아이디</b>임을 먼저 말합니다 — 앱만 써온 사람이 가장 많이 헷갈리는 지점입니다. ②입력칸 <b>바로 아래</b>에 카드사 공식 아이디 찾기·회원가입 페이지를 겁니다(운영에서는 SFSafariViewController로 열어 재설정한 비밀번호가 키체인에 저장되게 합니다). 삼성·롯데·하나·신한·BC의 회원가입은 로그인·메인 화면을 거치므로 실기기에서 경로를 확인해야 합니다. ③입력칸은 <code>autocomplete=username / current-password</code> — iOS의 <code>textContentType</code>에 해당해 저장된 비밀번호를 한 번에 채웁니다. ④<b>2회 실패하면 연결 버튼을 막고 재설정으로 보냅니다</b>. 카드사는 비밀번호 연속 오류 시 계정을 잠그고(하나·BC 5회), KNEWIT 때문에 카드사 계정이 잠기면 신뢰가 무너집니다. KB의 카드소지확인은 해당 오류가 올 때만 카드번호를 추가로 묻습니다. <b>비밀번호에 1234를 넣으면</b> 실패 흐름을 볼 수 있습니다. v3.10: 새 카드사를 연결하면 그 카드사만 활성으로 두고, 다른 카드사의 멈춤은 그대로 둡니다(UC-46). <b>v3.9.2: 한 화면</b> — 신뢰 문구는 ‘조회만 해요 · 비밀번호는 저장하지 않아요’ 한 줄, 나머지는 ‘자세히’ 시트로 옮겼습니다. ‘홈페이지 아이디’ 안내는 아이디 칸 라벨에 붙입니다. 입력 중(키보드)에는 제목이 한 줄로 줄고 신뢰 문구가 숨어 입력칸과 연결하기가 함께 보입니다. 큰 글자에서는 스크롤을 허용하되 연결하기는 아래에 붙어 있습니다."},
  "S-ONB-05":{n:"방문 내역 불러오기",fn:["FN-ON-060", "FN-ON-031"],note:"‘다 되면 알림 받기’ 위에 알림을 쓰는 이유와 거부할 수 있다는 것을 한 줄로 알리고, 누르면 iOS 알림 권한 팝업(OS-NOTI)을 띄웁니다(정보통신망법 제22조의2 첫 사용 시점 고지). 수집 → 장소성 분류 → 매칭 → 신뢰도 분기가 이 화면 뒤에서 순서대로 돕니다. 좌표를 확보하지 못한 건은 기록으로는 남지만 추천에는 들어가지 못합니다."},
  "S-ONB-06":{n:"첫 방문 요약",fn:["FN-ON-080"],note:"TASTE 화면(FN-TA-010)과 <b>같은 집계 로직</b>을 씁니다. 두 화면 수치가 다르면 설명 신뢰가 먼저 무너집니다."},
  "S-HOME-01":{n:"홈",fn:["FN-SY-080", "FN-RE-040", "FN-RE-010", "FN-RE-080", "FN-RE-110", "FN-RE-090", "FN-RE-100", "FN-RE-150", "FN-FR-060"],note:"<b>구경 모드(카드 미연결)</b>에서는 친구가 있으면 친구 세그먼트로, 없으면 추천 세그먼트로 열립니다 — 빈 탭으로 시작하지 않습니다. 구경 모드는 <b>친구 수에 따라 두 상태</b>로 나뉩니다. ①<b>친구 없음</b>(직접 설치 후 둘러보기로 막 들어온 상태): 친구 탭은 ‘아직 친구가 없어요 + 친구 추가하기’만, 추천은 시간대·거리만으로 계산하고, 장소 상세·내 취향·친구 목록에서도 친구 흔적을 모두 뺍니다. ②<b>친구 추가 후</b>(카드는 미연결): 친구 목록 위에 ‘나도 가본 곳이 있을까요?’ 연결 제안이 붙고, 추천에 친구 반복 방문 신호가 더해집니다. 초대 링크로 들어오면 처음부터 ②이고 초대한 친구의 레이어가 켜진 채로 시작합니다. 툴바의 두 ‘구경’ 버튼으로 각각 확인할 수 있습니다. <b>추천 세그먼트는 비워두지 않습니다</b> — 내 기록이 없어도 <b>지금 시간대 인기(외부 데이터) · 거리 · 친구 반복 방문</b>만으로 주변 3곳을 고르고(취향 신호 0, 프랜차이즈 감점), 목록 위에 ‘카드를 연결하면 더 잘 맞춰드려요’를 붙입니다. 빈 화면으로 연결을 요구하는 것보다, 쓸 만한 결과를 먼저 주고 “연결하면 이게 나아진다”를 말하는 쪽이 설득력이 있습니다. NEW/KNEW 배지와 색은 방문 기록이 있어야 의미가 있으므로 이 목록에서는 무채색으로 둡니다. 친구 목록 맨 위의 ‘나도 가본 곳이 있을까요?’는 친구 기록을 보는 바로 그 순간에 연결 이유를 말하는 자리입니다. 구조가 <b>지도 캔버스 + 플로팅 필터 + 결과 시트</b>로 바뀌었습니다. 필터는 가로 스크롤 한 줄이라 <b>늘어나도 세로 공간을 먹지 않고</b>, 추천 3곳은 바텀시트(끌어올리면 전체)와 번호 핀으로 같은 것을 두 번 말합니다. NEW/KNEW는 탭이 아니라 <b>장소의 속성</b>입니다 — 기본은 두 풀을 섞어 랭킹하고(신호 수가 달라 평균 정규화, 한쪽 쏠림이면 3번째를 반대 풀로 교체), 핀 색·배지가 구분을 맡으며, ‘처음 가는 곳만/다시 갈 곳만’ 칩은 원할 때만 쓰는 렌즈입니다. 카페의 목적 칩(작업·조용·디저트)은 후보를 거르지 않는 <b>랭킹 신호</b>입니다(장소속성 PoC 데이터, 커버리지 부분적). 카테고리는 <b>전체 · 카페 · 식당</b> 셋뿐입니다 — 추천 대상은 카페와 식당으로 한정하고, 술집·상점 결제는 기록과 취향 계산에는 남지만 추천 후보로는 올리지 않습니다. 컨트롤은 <b>빈도에 따라 층을 나눕니다</b>. 지도 위에는 매번 바꾸는 <b>카테고리</b>만 두고, 가끔 바꾸는 <b>동네·세부 조건</b>은 시트를 올려야 나옵니다 — 진입 화면에서 보이는 컨트롤이 적을수록 첫 화면이 답(추천)에 집중합니다. 접힌 상태에서도 시트 헤더가 “연남동 · 오후 · 조건 2”로 현재 기준을 항상 알려주므로, 숨겼다고 상태가 사라지지는 않습니다. 친구는 <b>사람 단위 레이어</b>입니다 — 친구 세그먼트 위의 <b>사람 칩</b>(지도 마커와 같은 색)이나 친구 프로필의 ‘지도에서 보기’로 그 사람의 장소만 겹칩니다. 지금 동네에 그 친구 기록이 없으면 그 친구가 가장 많이 간 동네로 지도를 옮깁니다. 친구 방문은 숫자 대신 ‘단골·가봤어요’로만 말합니다. 무채색 점은 나머지 후보 풀 — 추천이 어디서 나왔는지 맥락을 줍니다. 지도는 <b>휠·드래그·핀치·버튼으로 실제 확대/축소</b>가 되고, 핀 크기는 배율과 무관하게 유지하며 축소 시 라벨을 접습니다. <b>NEW/KNEW 필터 칩은 없앴습니다</b> — 마커 색과 배지가 이미 구분을 전달하는데 칩까지 두면 같은 정보를 세 번 말하게 되고, 통합 랭킹이 두 종류를 섞어주므로 평소에는 거를 이유도 없습니다. 굳이 한쪽만 보고 싶을 때는 <b>범례를 눌러</b> 거릅니다(범례가 곧 컨트롤). <b>친구 레이어</b>는 탭이 아니라 필터 줄의 토글입니다 — 친구 신호가 필요한 순간은 “지금 어디 갈까”를 결정하는 이 화면이지 별도 탭이 아니기 때문입니다. 레이어는 친구의 <b>공개 범위</b>(FN-SE-020)와 <b>반복 방문만 신호로 쓰는 규칙</b>(COM-08)을 그대로 따릅니다."},
  "S-HOME-02":{n:"세부 조건",fn:["FN-RE-030"],note:"와이어프레임의 <b>☰ 필터</b>를 그대로 옮긴 시트입니다. 두 가지가 설계의 핵심입니다. ①<b>‘지금 영업중’과 시간대 인기는 외부 장소 데이터</b>에서 가져옵니다(출처 확정 전). 사용자 결제를 모아 추정하지 않습니다. ②<b>‘정보 없음’과 ‘조건 불일치’를 구분</b>합니다. 속성은 공개 글에서 추출한 것이라 커버리지가 부분적이므로, 기본값은 미확인 장소를 남겨두고 확인된 장소를 위로 올리며(랭킹 신호 ‘조건 부합’), 엄격 모드를 켤 때만 미확인을 제외합니다. 이 구분이 없으면 데이터가 적은 초기에 필터를 켤수록 결과가 0이 됩니다. v3.8: 조건 이름이 시간대 칩을 따라갑니다 — 현재 시간대면 ‘지금 영업중’(기기 시각), 다른 시간대를 고르면 ‘OO에 영업중’(그 시간대 대표 시각). 영업 정보가 없는 곳은 기본으로 빼고 결과 위에서 ‘포함하기’로 되돌립니다."},
  "S-HOME-03":{n:"확인할 일",fn:["FN-SY-080", "FN-FR-050"],note:"매칭 정확도가 100%일 수 없으므로 확인 큐는 선택이 아니라 필수 안전장치입니다. 방문 확인이 주 업무라 위에 둡니다. 친구 요청은 한 줄 행(아바타 · 이름 · @아이디 · 함께 아는 친구, [수락] [✕])이고, 공개 범위는 묻지 않습니다 — 수락하면 같은 자리에 ‘친구가 됐어요 · 내 장소는 안 보여요 [공개 범위]’가 남고, [공개 범위]는 친구 시트를 엽니다. 요청이 3건 이상이면 2건만 보이고 ‘모두 보기’로 펼칩니다(critique 18). v3.9: 자동 확정된 방문도 다음 날 <b>‘어제 간 곳 · 또 가고 싶나요?’</b>로 묶어서 묻습니다(또 가고 싶어요 · 그냥 근처라 갔어요 · 건너뛰기). 알림은 하루 1회 묶음(COM-14)에 들어가고 따로 보내지 않습니다. 확인 대기는 <b>N일(기본안 14일)</b>이 지나면 1순위 후보 신뢰도가 기준(0.8) 이상이면 자동 확정, 미만이면 미기록으로 닫습니다."},
  "S-HOME-04":{n:"방문 장소 확인",fn:["FN-SY-081", "FN-SY-090"],note:"확정 직후 <b>“또 가고 싶은 곳인가요?”</b> 한 탭이 붙습니다. 별도 온보딩 없이 접근성 방문과 선호 방문을 가르는 최소 비용 신호입니다. v3.9: 같은 질문을 확인할 일의 ‘어제 간 곳’ 묶음과 장소 상세의 내 방문 기록에서도 답할 수 있습니다."},
  "S-PLC-01":{n:"장소 상세",fn:["FN-RE-080", "FN-RE-120", "FN-RE-150", "FN-PL-010", "FN-PL-020", "FN-PL-030", "FN-PL-040", "FN-PL-050", "FN-PL-070", "FN-PL-090"],note:"사진은 저장 가능한 소스가 없어 <b>미결 이슈 #1</b>입니다. 영업 표시는 <b>외부 영업시간 데이터만</b> 씁니다 — 있음(지금 영업중 / 영업 시간 아님) · 없음(영업 정보 없음). 결제 시간대로 추정하던 로직은 v3.7에서 뺐습니다. v3.8: 영업 표시는 시간대 칩과 관계없이 <b>항상 기기의 현재 시각</b>으로 판단하고, 영업 시간이 아니면 이유(브레이크타임 · 요일 휴무)를 붙입니다. 내 방문 기록은 ‘최근 6개월 N번 · 전체 M번’으로 보여 줍니다 — 단골 · 공개 판정은 6개월 횟수(K3), 전체 이력은 이 화면에서만 씁니다. v3.10.1: 장소를 밖으로 보내는 경로는 <b>카카오톡 공유(S-PLC-01c) 하나</b>입니다. 제목 줄에는 저장(별)만 두고, 버튼 줄은 ‘카톡으로 같이 가자’(왼쪽) · 길찾기(오른쪽)입니다. iOS 기본 공유 시트와 링크 복사는 두지 않습니다. v3.9: 내 방문 기록에서 ‘또 가고 싶은 곳인가요?’에 답할 수 있고, 자동 정리로 확정된 방문은 ‘자동 정리’로 표시해 고칠 수 있습니다. 미기록으로 정리된 결제는 1순위 후보 장소에 ‘방문으로 기록’ 행으로 남습니다."},
  "S-MY-01":{n:"내 취향",fn:["FN-RE-150", "FN-TA-010", "FN-FR-030"],note:"추천 내부가 쓰는 Taste Profile을 그대로 보여줍니다. 화면 표시값과 랭킹 입력값이 같은 소스여야 설명이 일관됩니다."},
  "S-PLS-01":{n:"내 장소",fn:["FN-RE-150", "FN-PL-051"],note:"좌표는 전부 <b>자체 POI 원장</b>에서 옵니다. 지도 SDK 응답을 저장할 수 없기 때문에, 이 화면은 우리가 가진 좌표를 우리가 직접 그리는 구조여야 합니다. 좌표를 확보하지 못한 장소는 지도에 찍히지 못하고 리스트에만 남습니다. 저장 탭의 목록에는 폴더만 둡니다 — 목록 추가(새 목록 · 지도 앱에서 가져오기)는 정렬 줄 오른쪽 ‘＋ 추가’ 메뉴로 모아(정렬은 왼쪽), 명령이 데이터 행처럼 보이지 않게 합니다. 폴더가 0~1개일 때만 목록 아래에 가져오기 안내 카드를 둡니다(한두 번 쓰는 기능이 매일 보는 목록에 상주하지 않게). 접힌 시트의 제목 옆에 목록 수 · 장소 수를 보여 줍니다. v3.8: 방문 핀의 숫자와 단골 표식은 <b>최근 6개월 횟수</b>입니다(K3). 전체 이력은 장소 상세에서만 보입니다."},
  "S-MY-03":{n:"친구 프로필",fn:["FN-PL-070", "FN-FR-031", "FN-FR-032", "FN-FR-033"],note:"친구의 공개 범위를 그대로 따릅니다. 결제 기반 방문 이력은 민감 정보라, 공개 범위 설정(FN-SE-020)이 친구 기능보다 <b>먼저</b> 존재해야 합니다."},
  "S-MY-04":{n:"친구 추가",fn:["FN-FR-010", "FN-FR-020", "FN-FR-051"],note:"추가 경로를 <b>한 화면에 모았습니다</b> — 내 아이디, 초대 링크 공유(카카오톡·복사), 아이디 검색. 초대와 추가를 별도 화면으로 갈라두면 사용자는 같은 목적에 두 입구를 만나게 됩니다. 진입점은 <b>프로필 → 친구 목록 → ＋</b>가 주 경로이고, 홈의 친구 세그먼트에서도 같은 화면으로 옵니다. 받은 요청은 여기가 아니라 <b>확인할 일</b>에 모읍니다."},
  "S-PLS-02":{n:"저장 목록 추가",fn:["FN-PL-060"],note:"네이버지도·카카오맵의 <b>공유 링크를 붙여넣으면</b> 서버가 목록을 수집합니다(PoC 실측: 카카오 525건 · 네이버 998건). 앱은 <code>POST /imports</code>와 폴링만 담당하고 파싱은 하지 않습니다. 빈 목록을 직접 만들 수도 있습니다. 링크가 비어 있으면 ‘클립보드에서 붙여넣기’ 칩을, 지원하지 않는 링크면 빨간 안내(aria-invalid · role=alert)를 보여 줍니다. 탭은 tab/tabpanel로 연결합니다.",},
  "S-SRCH-01":{n:"검색",fn:["FN-PL-080"],note:"지도 위 검색 아이콘을 누르면 <b>시트가 아니라 화면이 바뀝니다</b> — 검색은 지도를 잠깐 가리는 보조 동작이 아니라 그 자체가 목적지이기 때문입니다. 상단은 뒤로가기와 입력만 남기고, 아래는 입력 전에는 <b>최근 검색</b>, 입력 후에는 결과를 보여줍니다. 최근 검색은 개별 삭제할 수 있습니다."},
  "S-INV-01":{n:"초대 랜딩",fn:["FN-ON-020"],note:"초대 진입의 첫 화면입니다. 미설치 사용자는 스토어를 거친 뒤에도 <b>초대 코드가 유지</b>돼야 하고, 로그인이 끝나면 <b>초대한 친구의 장소를 볼 수 있게</b> 됩니다. 내 장소 공개는 자동이 아니라 카드 연결 뒤 첫 방문 요약에서 따로 묻습니다 — 결제 기반 방문 이력은 민감 정보이기 때문입니다. 이 표시(entry=invite)가 이후 로그인 화면의 배너와 카드사 선택 화면의 주 버튼을 바꿉니다. <b>버튼은 ‘시작하기’ 하나</b>입니다. 신규/기존 사용자 구분은 사용자가 고르는 게 아니라 로그인 후 서버가 판단합니다 — 기존 사용자는 온보딩을 건너뛰고 지수님 장소가 보이는 상태로 홈에 들어가고, 신규 사용자만 약관 동의부터 이어갑니다."},
  "S-MY-05":{n:"설정",fn:["FN-SY-100", "FN-RE-150", "FN-SE-010", "FN-SE-020", "FN-SE-030", "FN-SE-040", "FN-FR-032", "FN-SE-050", "FN-SE-060", "FN-SE-070", "FN-SE-080"],note:"설정은 탭이 아니라 <b>마이 안의 톱니 아이콘</b>으로 들어옵니다 — 설정은 하루에 한 번도 안 여는 화면이라 탭 하나를 상시 점유할 근거가 없고, 마이의 주 콘텐츠는 ‘내 취향’ 하나로 좁아집니다. <b>친구</b>는 두 자리로 나뉩니다 — 보기는 홈 친구 세그먼트, 관리(목록·추가·요청)는 프로필 → 친구입니다. <b>친구 공개 범위</b>를 바꿔보세요. 친구가 보게 될 내 장소 수가 바로 바뀝니다. v3.8: 카드 영역은 카드사별 묶음마다 <b>멈추기 · 재인증 · 연결 해제</b>를 두고, ‘카드사 추가’만 공통으로 남깁니다. ‘친구에게서 숨긴 장소’는 방문한 모든 장소를 보여 주고 행마다 상태(친구에게 보여요 / 아직 안 보여요 · 3번 가면 보여요)를 적습니다 — 미리 숨긴 곳은 3번째 방문 뒤에도 보이지 않습니다. 3회 판정은 최근 6개월 횟수입니다(K3)."},
  "S-CMN-01":{n:"빈 상태 · 오류",fn:["FN-SY-100", "FN-ER-010", "FN-ER-030", "FN-ER-040", "FN-ER-050", "FN-ER-060", "FN-ER-070", "FN-ER-080", "FN-SE-120"],note:"빈 상태는 원인을 구분해 안내합니다. 카드 미연결 / 동기화 미완료 / 실제 데이터 없음은 서로 다른 화면입니다."},
  "S-ONB-03a":{n:"카드 연결 동의 [BS]",fn:["FN-ON-050", "FN-SE-080"],note:"S-ONB-03의 ‘다음’에서 결제내역 조회 동의가 없을 때만 뜨는 바텀시트입니다. 결제내역 조회만 받고(결제 금액은 받지 않음), 한 번 동의하면 다음부터 건너뜁니다. 체크를 바꿔도 시트를 다시 띄우지 않고 내용만 갱신합니다."},
  "S-HOME-01b":{n:"위치 사용 [BS]",fn:["FN-SE-030","FN-RE-040","COM-03","COM-19"],note:"<b>지도에 처음 들어갈 때 한 번</b> 위치를 쓰는 이유와 위치기반서비스 이용약관 동의를 받습니다. ‘동의하고 위치 쓰기’는 동의 일시를 남기고 iOS 위치 권한 팝업(OS-LOC)으로 이어지고, 허용하면 현재 위치, 거부하면 동네 선택(S-HOME-01a)입니다. ‘동네 직접 고르기’는 약관 미동의 그대로입니다. 설정 › 위치기반서비스를 끄면 동의 철회, 다시 켤 때 이 시트가 다시 뜹니다. 약관이 없으면 iOS 권한이 있어도 좌표를 서버로 보내지 않습니다."},
  "S-ONB-01a":{n:"Apple 로그인 [OS]",fn:["FN-ON-010","FN-SE-040","FN-ER-080"],note:"Sign in with Apple 시스템 시트 흉내. <b>처음 가입</b>은 이름(편집 가능)과 이메일 공유 · 가리기를 고르고, <b>기존 회원</b>은 ‘Face ID로 계속’만 보입니다. Apple은 이름 · 이메일을 처음 가입할 때 한 번만 주므로 서버가 그때 저장합니다. 이름은 프로필 이름과 아바타 이니셜(COM-12)의 기본값, 이메일 가리기는 설정 › 계정에 privaterelay 주소로 보입니다. Face ID는 Apple 시트 안의 시스템 인증이라 앱이 NSFaceIDUsageDescription을 묻지 않습니다(앱 잠금 없음, D-18). 시트를 닫으면(취소) 오류 없이 이 화면에 그대로 있습니다."},
  "OS-LOC":{n:"iOS 위치 권한 [OS]",fn:["FN-ON-031","FN-SE-030"],note:"iOS 17 위치 권한 팝업 흉내 — 부제는 Info.plist 목적 문구. <b>아직 안 물음일 때만</b> 뜨고, 거부 뒤에는 앱 시트로 설정을 안내합니다. ‘정확한 위치’를 끄고 허용하면 대략적 위치: 동네 기준으로만 추천하고 도보 시간 대신 동네명, 헤더에 ‘대략적인 위치로 찾았어요’. 한 번 허용은 인스펙터 ‘앱 다시 열기’로 아직 안 물음이 됩니다."},
  "OS-NOTI":{n:"iOS 알림 권한 [OS]",fn:["FN-ON-031","FN-SE-050"],note:"iOS 알림 권한 팝업 흉내. S-ONB-05 ‘다 되면 알림 받기’와 설정의 알림 켜기가 같은 규칙을 씁니다 — 아직 안 물음이면 이 팝업, 거부면 ‘설정에서 알림을 허용해 주세요’ 시트, 허용이면 바로 켬."},
  "S-HOME-01a":{n:"동네 선택 [BS]",fn:["FN-RE-040"],note:"추천 시트의 <b>동네</b> 버튼으로 엽니다. 위치 권한이 없는 사람이 기준 위치를 고르는 자리라, ‘동네를 직접 골라요’ 안내(위치 약관 · 권한 안내 · 설정)가 모두 여기로 이어집니다. 서비스 범위는 <b>서울 전역</b>이라 목록은 바로가기일 뿐이고, 서울 안이면 지도를 옮겨 어디서든 다시 찾을 수 있습니다. 서울 밖에서 다시 찾기를 누르면 ‘지금은 서울에서만 추천해요’를 알립니다."},
  "S-PLC-01c":{n:"카카오톡 같이 가자 [BS]",fn:["FN-PL-090"],note:"같이 가자는 KNEWIT 안의 메시지가 아니라 <b>카카오톡 공유</b>입니다. 장소명 · 유형 · 동네와 보낸 사람이 담긴 OG 카드로 가고, 받는 사람이 KNEWIT 친구일 필요가 없습니다. 링크는 앱이 있으면 장소 상세, 없으면 웹 미리보기 → 설치로 이어집니다."},
  "S-PLC-01b":{n:"방문 기록 고치기 [BS]",fn:["FN-PL-040"],note:"장소 상세 방문 목록의 <b>각 행</b>에 있는 ‘기록이 틀렸나요?’에서 엽니다. 고치는 단위는 <b>방문 1건</b>(30분 병합 단위)입니다(K2). ‘다른 장소였어요’는 그 1건만 고른 장소로 옮겨 원래 장소 -1 · 새 장소 +1이 되고, ‘여기 간 적 없어요’는 그 1건만 빼고 범위 선택 시트(S-HOME-04b)로 갑니다. 남은 방문이 0건이면 내 방문 기록 영역이 ‘아직 안 가본 곳이에요’로 바뀝니다. 고친 판정은 <b>그 장소에 연결된 내 가맹점 전부</b>(카드사별 가맹점번호, K1)의 다음 결제에 적용하고, 간편결제 · PG 결제는 규칙 없이 매번 묻습니다. 토스트의 되돌리기는 방문과 그 동작이 만든 규칙을 함께 되돌립니다. (v3.8, K1~K2는 팀 확정 전 기본안)"},
  "S-HOME-04a":{n:"장소 직접 찾기 [BS]",fn:["FN-SY-081"],note:"방문 장소 확인에서 후보에 없을 때 장소 이름으로 찾는 바텀시트입니다. 결과가 없으면 ‘여기 간 적 없어요’로 빼두도록 안내합니다."},
  "S-PLC-01a":{n:"저장할 목록 [BS]",fn:["FN-PL-050"],note:"별을 누르면 <b>마지막에 쓴 목록</b>에 바로 저장하고, 토스트의 ‘목록 변경’으로 이 시트를 엽니다. 목록을 고르면 옮기고, 새 목록을 만들면 그 목록에 넣습니다. 매번 목록을 묻지 않는 것은 저장을 한 번의 탭으로 끝내기 위해서입니다."},
  "S-MY-05a":{n:"로그아웃 확인 [BS]",fn:["FN-SE-040"],note:"로그아웃하면 이 기기의 로그인 정보 · 최근 검색 · 알림 수신 등록을 지웁니다. 카드 연결과 기록은 계정에 남아, 다시 로그인하면 그대로 이어집니다."},
  "S-MY-05b":{n:"회원탈퇴 확인 [BS]",fn:["FN-SE-040"],note:"소셜 로그인 연결 해제(Apple 토큰 폐기)와 법정 보관 기록의 파기 시점을 함께 알립니다."},
  "S-MY-03a":{n:"차단 확인 [BS]",fn:["FN-FR-032"],note:"App Store 심사지침 1.2 — 사용자 간 콘텐츠가 있는 앱은 차단 수단이 필요합니다. 차단하면 친구가 끊기고 서로 보이지 않으며, 설정에서 풀 수 있습니다."},
  "S-MY-03b":{n:"신고 [BS]",fn:["FN-FR-033"],note:"App Store 심사지침 1.2 — 신고 수단과 시기적절한 대응(24시간)이 필요합니다. 신고하면서 차단하기가 기본으로 켜져 있습니다."},
  "S-ONB-04a":{n:"KB 카드소지확인 [BS]",fn:["FN-ON-044"],note:"CODEF 승인내역 API 기준 — KB국민카드는 가끔 카드소지확인 페이지로 넘어가며(CF-12108), 이때 카드번호 전체와 카드 비밀번호 앞 2자리를 넣어야 조회됩니다. 그 오류가 올 때만 띄웁니다(프로토타입에서는 KB국민카드에 비밀번호 0000). 입력은 다시 그리지 않고 버튼 상태만 바꿔 키패드가 닫히지 않게 합니다. 카드 비밀번호 일부는 전자금융거래법상 접근매체에 해당할 가능성이 커서 법률 검토 대상입니다."},
  "S-CMN-02":{n:"약관 · 동의서 보기 [BS]",fn:["FN-SE-080"],note:"약관 동의 화면의 ›, 카드 연결 동의, 친구 공개 동의, 설정의 약관 링크와 동의 내역에서 엽니다. 거의 전체 높이의 시트로 띄워 아래 화면(체크 상태)을 그대로 두고, 닫으면 열기 전 시트로 돌아갑니다. 개인정보 처리방침은 설정에서 굵게 표시합니다(작성지침: 다른 고지와 구분되게)."},
  "S-MY-05e":{n:"친구 공개 동의 [BS]",fn:["FN-SE-021", "FN-SE-080"],note:"신용정보법 제32조 — 결제에서 나온 방문 장소를 친구에게 보여주는 건 개인신용정보 제공이라 별도 동의로 받습니다. 공개 범위를 처음 ‘안 보여주기’ 밖으로 바꿀 때(설정, 초대 수락) 한 번만 뜨고, 동의하면 고른 값이 그대로 적용됩니다."},
  "S-MY-03c":{n:"친구 관리 [BS]",fn:["FN-FR-034","FN-FR-032","FN-FR-033"],note:"친구 프로필의 더보기와 친구 요청 수락 뒤 ‘공개 범위’에서 엽니다. 이 친구에게 보이는 내 장소 수를 알려 주고(범위는 모든 친구에게 같음, 설정에서 변경), 친구 끊기 · 차단 · 신고로 이어집니다."},
  "S-MY-03d":{n:"친구 끊기 확인 [BS]",fn:["FN-FR-034"],note:"친구를 끊어도 상대에게 알리지 않습니다. 토스트의 되돌리기로 바로 되돌릴 수 있습니다."},
  "S-MY-05f":{n:"카드 연결 해제 확인 [BS]",fn:["FN-SE-010","FN-ON-050","COM-11"],note:"<b>v3.10:</b> 해제는 카드사 단위입니다. 그 카드사 데이터만 지우고, 결제내역 수집 동의는 <b>마지막 카드사를 해제할 때만</b> 철회합니다. 시트에도 마지막 카드사일 때만 ‘결제내역 수집 동의도 철회돼요’를 붙입니다. 다시 연결할 때 동의 시트는 마지막 카드사를 해제한 뒤에만 다시 받습니다. (이전) 해제는 결제내역 수집 동의 철회로 보고, 카드에서 만든 방문 기록과 승인번호 암호값을 함께 지웁니다. 직접 저장한 장소는 남습니다. 쉬고 싶은 사용자는 ‘불러오기 잠시 멈추기’로 동의와 기록을 유지한 채 새 결제 수집만 멈출 수 있습니다(v3.6). 해제 · 멈추기는 <b>카드사 단위</b>이고, 시트에 ‘다시 연결해도 최근 N개월 결제만 돌아와요’(N = 카드사별 조회 가능 기간)를 적습니다(v3.7). v3.8: 해제하면 그 카드사 결제에서 만든 가게 판정 규칙도 함께 지웁니다."},
  "S-MY-05g":{n:"관심 없어요 목록 [BS]",fn:["FN-RE-121"],note:"추천에서 ‘관심 없어요’로 뺀 장소를 모아 보고 ‘다시 추천’으로 풉니다. 토스트의 되돌리기는 몇 초뿐이라, 실수로 뺀 장소를 되찾을 길이 따로 있어야 합니다."},
  "S-MY-05c":{n:"동의 내역 [BS]",fn:["FN-SE-060", "FN-SE-080"],note:"동의한 항목과 일시를 한곳에서 보여줍니다. 철회는 각 설정 스위치에서 합니다."},
  "S-MY-05d":{n:"내 데이터 받기 [BS]",fn:["FN-SE-070"],note:"개인정보보호법 열람 요구 — 10일 안에 응해야 해서 ‘최대 10일’로 안내합니다. v3.9: 대상은 실제로 보관하는 데이터만 — 방문 기록 · 저장 목록 · 친구 아이디 · 동의 내역 · 가게 판정 규칙. 승인내역 원본은 즉시 파기하므로 ‘결제 기록’은 뺐습니다."},

function restoreRules(prev){ if(!prev) return; const m=Object.assign({},S.merchantRules);
  Object.entries(prev).forEach(([k,v])=>{ if(v) m[k]=v; else delete m[k]; }); S.merchantRules=m; }
/* 방문 1건 꺼내기 · 되돌리기 (K2). 남은 방문이 0건이 되면 그 장소의 방문 기록도 없앤다 */
function takeLog(v,e){ const i=VISITS.indexOf(v); v.log=v.log.filter(x=>x!==e); const removed=!v.log.length; if(removed) VISITS.splice(i,1); return {v,e,i,removed}; }
function putLog(u){ if(u.removed&&!VISITS.includes(u.v)) VISITS.splice(Math.min(u.i,VISITS.length),0,u.v); u.v.log.push(u.e); }
function ingest(x,n){
  const mid=x.mid||"M-"+x.raw, rule=x.pg?null:(S.merchantRules[POLICY.ruleKey(n,mid)]||placeRule(x.place));   // K1 — 같은 장소에 매칭된 가맹점이면 카드사와 관계없이 적용. 간편결제는 규칙 없이 매번 묻는다
  if(rule&&rule.kind==="never") return "dropped";
  const to=rule&&rule.kind==="map"?rule.to:(x.pg?null:x.place);   // 옮긴 곳(to)의 규칙은 다시 따라가지 않는다 — 체인 금지 (v3.10 UC-51)
  if(to){ addVisit(to,{card:n,mid,mname:x.raw}); return "visit"; }
  const q={key:"q"+QUEUE.length+"_"+x.t,raw:x.raw,card:n,mid,pg:!!x.pg,norm:x.norm||x.raw,amt:0,when:"방금",cands:x.cands||[],kind:x.cands&&x.cands.length?"place":"pay",age:0,conf:x.conf||.6};
  QUEUE.push(q); S.queue.push({...q,done:false});
  if(!(S.cards[n]&&S.cards[n].paused)) SRV.notis.push({card:n,raw:x.raw,t:SRV.now()});   // 방문 확인 알림
  return "queued";
}

/* ═══════════ Taste Profile (FN-RE-010 · FN-TA-010) ═══════════ */
function taste(){
  const catW={}, prices=[]; let slotCount=[0,0,0,0,0], anchors=[];
  VISITS.forEach(v=>{
    const p=byId(v.id); if(!p||!v.ok) return;
    // 생활권 보정: 생활권 밖 반복 방문에 가중, 프랜차이즈 하향
    const outside=AREAS[p.area].anchor?1:1.7;
    const fr=p.fr?0.35:1;
    const lab=S.labels.has(v.id)?1.6:1;
    const w=Math.log2(v.n+1)*outside*fr*lab;
    catW[p.cat]=(catW[p.cat]||0)+w;
    for(let i=0;i<v.n;i++) prices.push(p.price);
    slotCount[v.slot]+=v.n;
    anchors.push({p,w,n:v.n});
  });
  anchors.sort((a,b)=>b.w-a.w);
  prices.sort((a,b)=>a-b);
  const med=prices.length?prices[Math.floor(prices.length/2)]:0;
  const tot=Object.values(catW).reduce((a,b)=>a+b,0)||1;
  const cats=Object.entries(catW).map(([k,v])=>({k,v:v/tot})).sort((a,b)=>b.v-a.v);
  const stot=slotCount.reduce((a,b)=>a+b,0)||1;
  return{cats,med,anchors,slots:slotCount.map(c=>c/stot),raw:catW};
}

/* ═══════════ 후보 생성 + 랭킹 ═══════════ */
/* 추천 기준점 — 지도에서 '다시 찾기'로 잡은 좌표(S.anchor) 또는 동네 중심. 거리는 기준점에서 잰다 (v3.4.3) */
const RADIUS=5;   // 다시 찾기 반경 5단위 ≈ 500m
const baseXY=()=>S.anchor||{x:AREAS[S.area].ax,y:AREAS[S.area].ay};
const dist=p=>Math.hypot(gx(p)-baseXY().x,gy(p)-baseXY().y)*100;
const meName=()=>(S.acct&&S.acct.name)||"김겨레";
const meIni=()=>{const n=meName().trim(); return /^[가-힣]{3,4}$/.test(n)?n[1]:(n[0]||"?").toUpperCase();};   // COM-12 — 한글 세 글자 이상이면 성을 뺀 첫 글자
/* 위치를 쓸 수 있는가 — 위치 약관 동의와 iOS 권한이 둘 다 있어야 한다. 하나라도 없으면 좌표를 서버로 보내지 않는다 (v3.10 추가분) */
const locUsable=()=>S.consent.loc&&["granted","once","approx"].includes(S.os.loc);
const precise=()=>locUsable()&&S.os.loc!=="approx";
const meDist=p=>Math.hypot(gx(p),gy(p))*100;   // 내 위치(연남동 중심)에서 잰 거리 — 카드의 도보 시간은 늘 내 위치 기준
const inSeoul=(x,y)=>x>-60&&x<170&&y>-120&&y<50;   // 프로토타입 지도의 서울 경계 (v3.5: 서비스 범위 = 서울 전역)
const inBase=p=>S.anchor?(Math.hypot(gx(p)-S.anchor.x,gy(p)-S.anchor.y)<=RADIUS):p.area===S.area;
const walkMin=d=>Math.max(1,Math.round(d/67));

let OPEN_CUT=0;   // '지금 영업중'에서 영업 정보가 없어 뺀 곳 수
function candidates(){
  const t=taste(); OPEN_CUT=0;
  const all=POIS.filter(inBase);
  const steps=[{lbl:"기준 위치 반경 내",v:all.length,cut:""}];
  let c=all.filter(inScope);
  steps.push({lbl:"카테고리 · "+(S.cat==="전체"?"카페·식당":catLabel(S.cat)),v:c.length,cut:"−"+(all.length-c.length)});
  const before=c.length;
  c=c.filter(p=>!S.disliked.has(p.id));
  steps.push({lbl:"관심 없음 제외",v:c.length,cut:S.disliked.size?"−"+(before-c.length):"—"});
  const b2=c.length;
  if(S.mode==="NEW") c=c.filter(p=>!visitOf(p.id));
  else if(S.mode==="KNEW") c=c.filter(p=>{const v=visitOf(p.id);return v&&v.ok;});
  else c=c.filter(p=>{const v=visitOf(p.id);return !v||v.ok;}); // MIX: 미확정 방문만 제외
  steps.push({lbl:S.mode==="NEW"?"미방문만":S.mode==="KNEW"?"확정된 방문만":"미방문 + 확정 방문",v:c.length,cut:"−"+(b2-c.length)});
  const fl=[...S.filters];
  if(fl.length){
    const bf=c.length;
    const pass=(p,k)=>{ const h=attrHit(p,k); if(k==="open") return h===1||(h===0&&S.openIncl); return h===1||(h===0&&!S.strict); };   // 영업 정보 없는 곳은 '포함하기' 전까지 뺀다
    if(fl.includes("open")&&!S.openIncl) OPEN_CUT=c.filter(p=>openState(p)===0&&fl.every(k=>k==="open"||pass(p,k))).length;
    c=c.filter(p=>fl.every(k=>pass(p,k)));
    steps.push({lbl:"세부 조건 · "+fl.map(ATTR_L).join("·"),v:c.length,cut:"−"+(bf-c.length)});
  }
  const b3=c.length;
  c=c.filter(p=>!S.excluded.has(p.id));
  steps.push({lbl:"직전 노출 제외",v:c.length,cut:S.excluded.size?"−"+(b3-c.length):"—"});
  return{list:c,steps,t};
}

function score(p,t){
  const f={};
  const vis=visitOf(p.id);
  const isKnew=!!(vis&&vis.ok);           // 장소 단위로 NEW/KNEW를 판정 — 모드는 풀을 거를 뿐
  const catAff=(t.raw[p.cat]||0)/(Math.max(...Object.values(t.raw))||1);
  f.dist={v:Math.exp(-dist(p)/380),lbl:"거리"};
  f.time={v:p.h[S.slot],lbl:"시간대"};
  // 세부 조건 — 통과한 후보 안에서 '확인된 곳'을 '정보 없는 곳'보다 위로 올린다
  const soft=[...S.filters].filter(k=>k!=="open");
  if(soft.length){
    const hits=soft.map(k=>attrHit(p,k));
    const v=hits.reduce((a,h)=>a+(h===1?1:h===0?0.45:0),0)/soft.length;
    f.attr={v:v,lbl:"조건 부합"};
  }
  if(!isKnew){
    f.anchor={v:catAff*0.65+0.175,lbl:"취향 적합"};   // 결제 금액은 받지 않는다 (v3.7) — 옛 가격 항은 상수로 남겨 점수 척도만 유지
    f.novel={v:p.nw?0.82:0,lbl:"신규 개업"};
    f.friend={v:friendSignal(p.id).v,lbl:"친구 신호"};
    if(S.saved.has(p.id)&&!S.disliked.has(p.id)) f.saved={v:1,lbl:"저장"};   // 관심 없어요가 우선 — 저장 가점 없음 (v3.10 UC-60)   // 저장했지만 안 가본 곳 — NEW IT 안에서 1순위 신호 (v3.9)
    if(p.fr) f.anchor.v*=0.55;
  }else{
    f.recency={v:Math.exp(-vis.days/22),lbl:"최근성"};
    f.repeat={v:Math.min(vis.n/8,1),lbl:"반복 방문"};
    // 매일 가는 습관 장소(프랜차이즈)는 추천으로서 정보 이득이 없다 → 하향
    if(p.fr){f.recency.v*=0.5;f.repeat.v*=0.5;}
  }
  const vals=Object.values(f);
  const sum=vals.reduce((a,b)=>a+b.v,0);
  vals.forEach(x=>x.c=sum?x.v/sum:0);
  const total=(vals.length?sum/vals.length:0)+(f.saved?POLICY.newIt.saved:0); // 신호 수가 다른 두 풀을 비교하기 위한 평균 정규화 + 저장 가점
  const top=Object.entries(f).sort((a,b)=>b[1].c-a[1].c)[0];
  return{p,f,total,type:isKnew?"KNEW":"NEW",topKey:top[0],topC:top[1].c};
}

/* Why 생성 (FN-RE-100) — 기여 1위부터 eligibility 검사 */
function why(sc,t,used){
  let order=Object.entries(sc.f).sort((a,b)=>b[1].c-a[1].c);
  // 사용자가 방금 고른 목적이 이 장소에서 성립하면 Why 1순위로 — 입력에 대한 즉각 피드백
  if(sc.f.attr&&sc.f.attr.v>=0.9) order=[["attr",sc.f.attr]].concat(order.filter(([k])=>k!=="attr"));
  // KNEW IT은 '가본 곳'이 약속이다 — 시간대·유형보다 내 방문 사실(몇 번·언제)을 먼저 말한다
  // NEW IT은 '취향에 맞는 곳'이 약속이다 — 내 단골과 닮았다는 이유를 먼저
  else if(sc.type==="NEW"&&sc.f.saved) return{key:"saved",text:tpl("saved",sc,t),share:sc.f.saved.c};
  else if(sc.type==="NEW"&&sc.f.anchor){ const w=tpl("anchor",sc,t); if(w) return{key:"anchor",text:w,share:sc.f.anchor.c}; }
  else if(sc.type==="KNEW") for(const k of ["repeat","recency"]){
    const w=sc.f[k]&&tpl(k,sc,t); if(w) return{key:k,text:w,share:sc.f[k].c}; }
  const fresh=order.filter(([k])=>!used||!used.has(k));
  for(const [k,v] of fresh.concat(order)){
    const w=tpl(k,sc,t);
    if(w) return{key:k,text:w,share:v.c};
  }
  return null;
}
function tpl(k,sc,t){
  const p=sc.p;
  if(k==="anchor"){
    const a=t.anchors.find(a=>a.p.cat===p.cat&&a.p.id!==p.id);
    if(a&&a.n>=2) return `<b>자주 가는 ${a.p.name}</b>${josa(a.p.name,"과","와")} 비슷한 곳이에요`;
    return null;
  }
  if(k==="saved") return `<b>저장해 둔 곳</b>이에요`;
  if(k==="dist") return null;   // 거리는 줄 오른쪽이 이미 말한다
  if(k==="time"){ if(t.slots[S.slot]<0.08) return null; return `<b>${SLOTS[S.slot]}</b>에 자주 가는 유형이에요`; }
  if(k==="novel") return p.nw?`<b>이번 달 새로 문 연</b> 곳이에요`:null;
  if(k==="friend"){
    const{who}=friendSignal(p.id); if(!who.length) return null;
    const nm=who.slice(0,2).map(x=>x.f.name).join("·");
    return `취향이 비슷한 <b>${nm}</b>${who.length>2?` 외 ${who.length-2}명이`:josa(who[Math.min(1,who.length-1)].f.name,"이","가")} 반복 방문했어요`;
  }
  if(k==="attr"){
    const hit=[...S.filters].filter(x=>x!=="open"&&attrHit(p,x)===1);
    if(!hit.length) return null;
    return `<b>${hit.map(ATTR_L).join(" · ")}</b> 조건에 맞는 곳이에요`;
  }
  if(k==="recency"){ const v=visitOf(p.id); return `<b>가본 곳</b> · 마지막 ${v.days}일 전`; }
  if(k==="repeat"){ const v=visitOf(p.id); return v.n>=3?`<b>자주 간 곳</b> · 마지막 ${v.days}일 전`:null; }
  return null;
}

/* 최종 조합 (FN-RE-090) — 다양성 제약 */
/* 구경 모드 추천 — 내 기록이 없으므로 취향 신호 없이
   ① 지금 시간대 결제 활성도 ② 거리 ③ 친구 반복 방문 ④ 프랜차이즈 감점만으로 고른다 */
function recommendGeneric(){
  const {list,steps}=candidates();
  const fmap={}; if(!S.noFriends) friendsHere().forEach(x=>{fmap[x.p.id]=x.who.length;});
  const W={slot:.35,near:.25,friend:.4};
  const scored=list.map(p=>{
    const d=dist(p);
    const f={slot:{lbl:"시간대 활성도",v:p.h[S.slot]||0},near:{lbl:"가까움",v:Math.max(0,1-d/900)}};
    if(fmap[p.id]) f.friend={lbl:"친구 반복 방문",v:Math.min(1,fmap[p.id]/2)};
    let total=0,topKey="slot",topC=0;
    Object.keys(f).forEach(k=>{const c=f[k].v*W[k]; total+=c; if(c>topC){topC=c;topKey=k;}});
    if(p.fr){ f.chain={lbl:"프랜차이즈 감점",v:1}; total-=.12; }
    return {p,f,total,topKey,topC:total>0?topC/total:0,type:"GEN",d,friends:fmap[p.id]||0};
  }).sort((a,b)=>b.total-a.total);
  const rounds=1+(S.more||0), out=[], chosen=new Set(), tUsed=new Set();
  for(let r=0;r<rounds;r++){
    const gUsed={}, target=out.length+3;
    for(const s of scored){
      if(out.length>=target) break;
      if(chosen.has(s.p.id)||s.p.fr) continue;
      if(S.cat==="전체"&&(gUsed[s.p.g]||0)>=2) continue;
      gUsed[s.p.g]=(gUsed[s.p.g]||0)+1; chosen.add(s.p.id);
      const say=k=>k==="friend"?`친구 ${s.friends}명이 반복해서 간 곳`:k==="near"?`가까운 ${s.p.cat}`:`${SLOTS[S.slot]}에 사람들이 많이 가는 곳`;
      const keys=Object.keys(s.f).filter(k=>W[k]).sort((a,b)=>s.f[b].v*W[b]-s.f[a].v*W[a]);
      const key=keys.find(k=>!tUsed.has(say(k)))||s.topKey;
      let text=say(key); if(tUsed.has(text)) text=`${SLOTS[S.slot]}에 많이 가는 ${s.p.cat}`;
      tUsed.add(text);
      out.push({...s,why:{text,key}});
    }
  }
  S.pipe=steps.concat([{lbl:"취향 신호 없음 · 시간대·거리·친구",v:out.length,cut:"상위 3"}]);
  S.trace={rows:scored.slice(0,6),picked:new Set(out.map(o=>o.p.id)),t:null};
  S.allCands=scored; lastRecos=out;
  return out;
}
function recommend(){
  const {list,steps,t}=candidates();
  const scored=list.map(p=>score(p,t)).sort((a,b)=>b.total-a.total);
  /* '더 보기'는 앞의 추천을 지우지 않고 뒤로 이어 붙인다.
     라운드마다 3장씩 새로 고르되 다양성 상한은 라운드 안에서만 세므로,
     1라운드의 결과는 더 눌러도 그대로 남는다. */
  const rounds=1+(S.more||0);
  const out=[];const chosen=new Set();const whyUsed=new Set();
  for(let r=0;r<rounds;r++){
    const catUsed={},gUsed={},target=out.length+3;
    for(const s of scored){
      if(out.length>=target) break;
      if(chosen.has(s.p.id)||(s.p.fr&&s.type==="NEW")) continue;   // 프랜차이즈는 새로 갈 곳에서 제외, 다시 갈 곳은 점수 감점만 (v3.5)
      if((catUsed[s.p.cat]||0)>=2) continue;
      // '전체'는 카페·식당 둘 다 보여준다고 약속한 스코프다 — 한 종류가 3장을 채우지 못하게 막는다
      if(S.cat==="전체"&&(gUsed[s.p.g]||0)>=2) continue;
      const w=why(s,t,whyUsed);
      if(!w) continue;                    // 설명 못 하는 장소는 제외
      catUsed[s.p.cat]=(catUsed[s.p.cat]||0)+1;
      gUsed[s.p.g]=(gUsed[s.p.g]||0)+1;
      whyUsed.add(w.key); chosen.add(s.p.id);
      out.push({...s,why:w});
    }
    // MIX에서 한 종류로 쏠리면 3번째를 반대 풀 최고 후보로 교체 — 새로움과 익숙함의 균형
    if(r===0&&out.length===3&&(!out.some(o=>o.type==="NEW")||(S.mode==="MIX"&&out.every(o=>o.type==="NEW")))){   // 1~3위에 NEW 최소 1곳
      const want=out[0].type==="NEW"?"KNEW":"NEW";
      for(const s of scored){
        if(s.type!==want||(s.p.fr&&want==="NEW")||out.find(o=>o.p.id===s.p.id)) continue;
        // 교체 후보도 유형 상한을 지켜야 한다 — 안 그러면 다양성 제약이 여기서 무너진다
        if(S.cat==="전체"&&out.slice(0,2).filter(o=>o.p.g===s.p.g).length>=2) continue;
        const w=why(s,t,null);
        if(!w) continue;
        chosen.delete(out[2].p.id); out[2]={...s,why:w}; chosen.add(s.p.id);
        break;
      }
    }
  }
  S.pipe=steps.concat([{lbl:S.cat==="전체"?"다양성 제약 · 유형당 2곳":"다양성 제약 · Why 성립",v:out.length,cut:"상위 3"}]);
  S.trace={rows:scored.slice(0,6),picked:new Set(out.map(o=>o.p.id)),t};
  S.allCands=scored; lastRecos=out;
  return out;
}

let lastRecos=[], lastRows=[];
// 바텀시트 정지점(px) — 네이버 지도처럼 끌어올리면 리스트가 된다
/* 내 장소 시트는 두 정지점만 — 기본(peek)과 검색창까지 덮는 전체(full). 중간 정지점 없음 (네이버 지도식) */

## 제2조 (정의)
1. "서비스"란 회원의 방문 기록을 바탕으로 장소를 기록·추천하고, 저장 목록과 친구 기능을 제공하는 KNEWIT 앱과 그에 딸린 모든 기능을 말합니다.

3. "카드 연결"이란 회원이 본인 명의 카드사 홈페이지 계정으로 결제내역 조회를 요청하여, 결제한 가맹점을 방문 기록으로 불러오는 기능을 말합니다.
4. "방문 기록"이란 카드 연결로 불러온 결제내역이나 회원이 직접 남긴 기록에서 만든 장소 방문 정보를 말합니다.
5. "친구"란 서로 친구 요청을 수락한 회원을 말합니다.
6. "게시물"이란 회원이 서비스에 올린 프로필 이름·사진, 저장 목록 이름 등 글·사진과 그 밖의 정보를 말합니다.

## 제3조 (약관의 명시, 설명과 개정)
1. 회사는 이 약관의 내용과 상호, 대표자, 주소, 연락처, 사업자등록번호를 회원이 쉽게 알 수 있도록 앱의 설정 화면에 게시합니다.
2. 회사는 「약관의 규제에 관한 법률」 등 관련 법령을 위배하지 않는 범위에서 이 약관을 개정할 수 있습니다.
3. 약관을 개정하면 적용일과 개정 사유를 밝혀 **적용일 7일 전부터** 앱 안에 공지합니다. 회원에게 불리하게 바꾸는 경우에는 **적용일 30일 전부터** 공지하고, 바뀌기 전과 후의 내용을 비교해 보여주며 앱 알림 등 전자적 방법으로 따로 알립니다.
4. 회원은 개정 약관에 동의하지 않으면 적용일 전까지 이용계약을 해지(탈퇴)할 수 있습니다. 회사가 제3항에 따라 알리면서 "적용일까지 거부 의사를 밝히지 않으면 동의한 것으로 본다"는 뜻을 분명히 알렸는데도 회원이 거부 의사를 밝히지 않으면, 개정 약관에 동의한 것으로 봅니다.

## 제4조 (약관 외 준칙)
1. 개인정보의 처리는 회사의 **개인정보 처리방침**에 따릅니다.
2. 위치기반서비스 이용은 별도의 **위치기반서비스 이용약관**에 따릅니다.
3. 이 약관에 정하지 않은 사항은 관련 법령과 일반적인 상관례에 따릅니다.

## 제5조 (회원가입)
1. 이용계약은 가입하려는 사람이 이 약관에 동의하고 카카오 또는 Apple 계정으로 가입을 신청한 뒤, 회사가 승낙하면 성립합니다.
2. 서비스는 **만 14세 이상**만 가입할 수 있습니다.
3. 회사는 다음 중 하나에 해당하는 신청은 승낙하지 않거나 나중에 이용계약을 해지할 수 있습니다.
- 다른 사람의 명의나 계정을 이용한 경우
- 만 14세 미만인 경우
- 이 약관 위반으로 이용계약이 해지된 날부터 1년이 지나지 않은 경우(회사가 재가입을 승낙한 경우는 제외)

## 제6조 (서비스의 내용)
1. 회사는 다음 서비스를 제공합니다.
- 카드 결제내역을 바탕으로 한 방문 기록과 지도
- 방문 기록, 저장 목록, 현재 위치(동의한 경우)를 바탕으로 한 장소 추천
- 저장 목록 만들기와 네이버지도·카카오맵 공유 링크로 목록 가져오기
- 친구 맺기와, 회원이 고른 범위에서 친구와 장소 공유
2. 서비스는 무료입니다. 유료 기능을 도입하면 미리 이 약관에 정하고 따로 동의를 받습니다.
3. 추천은 회원의 기록과 공개된 장소 정보를 바탕으로 한 참고 정보입니다. 영업시간, 편의 정보 등은 실제와 다를 수 있으니 방문 전에 확인해 주세요. 회사가 대가를 받고 노출하는 장소가 생기면 그 사실을 표시합니다.

## 제7조 (카드 연결)
1. 회원은 **본인 명의 카드**만 연결할 수 있습니다.
2. 카드 연결은 회원이 결제내역 조회·수집에 동의한 경우에만 이루어집니다. 카드사 로그인과 내역 조회는 회사가 위탁한 연결 대행사(CODEF)가 처리하며, 회원의 카드사 아이디와 비밀번호는 연결 대행사가 암호화하여 보관하고 회사는 볼 수 없습니다.
3. 카드사 점검, 홈페이지 변경, 카드사의 접속 제한 등 회사가 통제할 수 없는 사유로 내역을 불러오지 못하거나 늦게 반영될 수 있습니다.
4. 회원은 설정에서 언제든 카드 연결을 해제할 수 있습니다. 해제하면 카드 결제내역으로 만든 방문 기록을 지체 없이 지웁니다. 새 결제만 잠시 불러오지 않으려면 설정에서 불러오기를 멈출 수 있으며, 이때 동의와 기록은 그대로 유지됩니다.
5. 회사는 카드 연결의 대가로 포인트, 현금 등 경제적 이익을 제공하지 않습니다.

## 제8조 (서비스의 변경과 중단)
1. 회사는 운영상, 기술상 필요에 따라 서비스의 내용을 바꿀 수 있습니다. 회원의 이용에 중요한 영향을 주는 변경은 **30일 전에** 앱 안에 공지합니다.
2. 회사는 설비 점검, 고장, 통신 장애, 카드사·연결 대행사의 사정 등으로 서비스를 일시 중단할 수 있습니다. 이 경우 미리 공지하며, 미리 알릴 수 없는 사정이 있으면 사후에 알립니다.
3. 회사가 사업을 종료하는 경우 **30일 전에** 알리고, 회원이 자신의 기록을 내려받을 수 있도록 합니다.

## 제9조 (회원에 대한 통지)
1. 회사는 회원에게 앱 알림, 앱 안의 공지, 가입한 소셜 계정의 이메일 등으로 알립니다.
2. 회원 전체에 대한 통지는 7일 이상 앱 안에 공지하는 것으로 개별 통지를 대신할 수 있습니다. 다만 회원의 권리·의무에 중대한 영향을 주는 사항은 개별 통지합니다.

## 제10조 (탈퇴와 이용 제한)
1. 회원은 **설정 > 회원탈퇴**에서 언제든 탈퇴할 수 있으며, 회사는 즉시 처리합니다. 탈퇴하면 카드 연결과 소셜 로그인 연결이 함께 해제되고, 회원의 정보는 개인정보 처리방침에 따라 파기합니다.
2. 회사는 회원이 다음 중 하나에 해당하면 서비스 이용을 제한하거나 이용계약을 해지할 수 있습니다.
- 다른 사람의 명의, 카드 또는 계정을 이용한 경우
- 다른 회원을 괴롭히거나 사칭하는 등 다른 회원의 이용을 방해한 경우
- 자동화된 수단으로 서비스의 정보를 수집하거나 서비스를 비정상적으로 이용한 경우
- 법령이나 이 약관을 위반한 경우
3. 회사는 이용을 제한하기 전에 사유와 기간을 알리고 의견을 낼 기회를 줍니다. 긴급한 경우에는 먼저 제한하고 바로 알립니다. 회원은 제한에 대해 이의를 신청할 수 있습니다.

## 제11조 (회사의 의무)
1. 회사는 법령과 이 약관을 지키며, 계속적이고 안정적으로 서비스를 제공하기 위해 노력합니다.
2. 회사는 회원의 개인정보와 개인신용정보를 보호하기 위해 보안 시스템을 갖추고 개인정보 처리방침을 공개하고 지킵니다.
3. 회사는 회원의 불만이나 의견이 정당하면 처리하고, 처리 결과를 앱 알림이나 이메일로 알립니다.

## 제12조 (회원의 의무)
회원은 다음 행위를 해서는 안 됩니다.
- 다른 사람의 카드, 카드사 계정 또는 KNEWIT 계정을 이용하는 행위
- 다른 사람을 사칭하거나 다른 회원을 괴롭히는 행위
- 음란하거나 폭력적인 내용, 다른 사람의 권리를 침해하는 내용을 게시하는 행위
- 크롤러 등 자동화된 수단으로 서비스의 정보를 수집하는 행위
- 서비스를 영리 목적으로 무단 이용하거나 운영을 방해하는 행위

## 제13조 (계정 관리)
1. 회원은 자신의 소셜 계정과 기기를 안전하게 관리해야 합니다.
2. 계정이 도용된 사실을 알게 되면 바로 회사에 알리고 안내에 따라야 합니다.

## 제14조 (친구와 공개 범위)
1. 회원의 장소는 기본적으로 친구에게 **보이지 않습니다.** 회원이 친구 공개에 동의하고 공개 범위를 고른 경우에만, 고른 범위의 장소 이름과 자주 가는 곳인지가 친구에게 보입니다. 결제 금액, 결제 일시, 카드 정보는 보이지 않습니다.
2. 회원은 모든 친구에게 같은 공개 범위를 정하고, 장소를 하나씩 숨기거나, 언제든 공개를 멈출 수 있습니다. 3번 이상 방문한 곳만 친구에게 보입니다.
3. 회원은 다른 회원을 차단하거나 신고할 수 있습니다. 회사는 신고를 받으면 24시간 안에 확인하고 필요한 조치를 한 뒤 결과를 알립니다.

## 제15조 (게시물의 관리)
1. 회원의 게시물이 다른 사람의 사생활 침해나 명예훼손 등 권리를 침해하면, 권리를 침해당한 사람은 회사에 삭제 등을 요청할 수 있습니다. 회사는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제44조의2에 따라 해당 게시물을 삭제하거나 **30일 이내**에서 접근을 임시로 막는 조치(임시조치)를 하고, 그 사실을 요청한 사람과 게시한 회원에게 알립니다.
2. 회사는 권리 침해 여부를 판단하기 어렵거나 다툼이 예상되는 게시물에 대해 제1항의 임시조치를 할 수 있습니다.
3. 게시한 회원은 임시조치에 대해 이의를 제기하거나 게시물의 재게시를 요청할 수 있습니다.

## 제16조 (저작권)
1. 서비스와 그 구성에 대한 저작권과 지식재산권은 회사에 있습니다.
2. 회원이 올린 게시물의 저작권은 회원에게 있습니다. 회원은 회사가 서비스를 운영하고 친구에게 보여주는 데 필요한 범위에서 게시물을 무상으로 이용하는 것을 허락합니다. 이 허락은 게시물을 지우거나 탈퇴하면 끝납니다.

## 제17조 (책임의 제한)
1. 회사는 천재지변, 카드사·통신사의 장애 등 불가항력으로 서비스를 제공할 수 없으면, 회사에 고의 또는 과실이 없는 한 책임을 지지 않습니다.
2. 회사는 회원의 귀책사유로 생긴 서비스 이용 장애에 대해서는 책임을 지지 않습니다.
3. 회사는 장소의 영업 정보 등 제3자가 제공한 정보의 정확성에 대해, 회사에 고의 또는 과실이 없는 한 책임을 지지 않습니다.

## 제18조 (분쟁 해결)
1. 회사는 회원의 의견이나 불만을 처리하기 위해 고객 지원 창구(설정 > 문의하기, ${BIZ.mail})를 운영합니다.
2. 회사와 회원 사이에 분쟁이 생기면 회원은 한국소비자원 등 관계 기관에 조정을 신청할 수 있습니다.

## 제19조 (준거법과 재판관할)
이 약관은 대한민국 법률에 따릅니다. 서비스 이용과 관련한 소송은 「민사소송법」에 따른 관할 법원에 제기합니다.

## 3. 개인정보의 파기 절차와 방법
1. 보유 기간이 끝나거나 처리 목적을 달성하면 **5일 이내**에 파기합니다.
2. 다른 법령에 따라 보존해야 하는 정보는 다른 정보와 분리하여 저장하고, 해당 기간이 지나면 파기합니다.
3. 전자적 파일은 복구할 수 없는 방법으로 지우고, 종이 문서는 분쇄하거나 소각합니다.

## 4. 개인정보의 제3자 제공
회사는 정보주체가 **친구에게 내 장소 공개**에 동의한 경우에만 다음과 같이 제공합니다.

| 제공받는 자 | 이용 목적 | 제공 항목 | 보유 기간 |
| --- | --- | --- | --- |
| 정보주체가 친구 요청을 수락한 KNEWIT 회원 | 친구와 장소 공유 | 공개 범위 안의 장소 이름, 자주 가는 곳인지 여부, 프로필 이름·사진·아이디 | 앱 안에서 보여주기만 하며, 공개를 멈추거나 친구 관계가 끝나면 더 이상 보이지 않습니다 |

**결제 금액, 결제 일시, 카드 정보는 제공하지 않습니다.** 이 밖에는 법령에 특별한 규정이 있는 경우를 제외하고 제3자에게 제공하지 않습니다.

5. 다른 법령에서 수집 대상으로 정한 정보는 삭제를 요구할 수 없습니다.

function termsHTML(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const out=[]; let list=null, tbl=null;
  const flush=()=>{ if(list){ out.push(`<${list.k}>${list.i.map(x=>`<li>${x}</li>`).join("")}</${list.k}>`); list=null; }
    if(tbl){ const [h,...r]=tbl; out.push(`<div class="tscroll"><table${h.length>=4?' class="wide"':""}><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); tbl=null; } };
  src.trim().split("\n").forEach(raw=>{ const l=raw.trim();
    if(!l){ flush(); return; }
    if(l.startsWith("|")){ if(list) flush(); const cells=l.slice(1,-1).split("|").map(c=>c.trim()); if(cells.every(c=>/^-+$/.test(c))) return; (tbl=tbl||[]).push(cells); return; }
    if(tbl) flush();
    let m;
    if(l.startsWith("## ")){ flush(); out.push(`<h2>${inl(l.slice(3))}</h2>`); return; }
    if(l.startsWith("### ")){ flush(); out.push(`<h3>${inl(l.slice(4))}</h3>`); return; }
    if((m=l.match(/^- (.*)/))){ if(!list||list.k!=="ul"){ flush(); list={k:"ul",i:[]}; } list.i.push(inl(m[1])); return; }
    if((m=l.match(/^\d+\. (.*)/))){ if(!list||list.k!=="ol"){ flush(); list={k:"ol",i:[]}; } list.i.push(inl(m[1])); return; }
    flush(); out.push(`<p>${inl(l)}</p>`);
  });
  flush(); return out.join("");
}

    const seen=f=>f.ids.filter(id=>visitOf(id)).length;

      </div>

    </div>
    <button class="fab" data-act="zoom" data-v="reset" aria-label="현재 위치로" style="bottom:${st+16}px;display:${(S.mapOnly||full)?"none":"flex"}">${IC.locate}</button>
    <div class="homesheet drag${full?" isfull":""}" data-sheet="places" style="height:${full?"100%":st+"px"};display:${S.mapOnly?"none":"flex"}">
      ${full?`<div class="fullbar navbar"><button class="navback" data-act="${openF?"closefolder":"plssheet"}" aria-label="${openF?"저장 목록으로":"지도로 돌아가기"}">${IC.back}</button>
        <h1 class="plstitle nb-title">${openF?esc(openF.name):"내 장소"}</h1><span></span></div>`
      :`<button class="sgrip" data-act="plssheet" aria-expanded="false" aria-label="내 장소 펼치기"><span></span></button>`}
      ${openF?"":`<div class="sheetseg plsseg">
          ${["저장","방문"].map(f=>`<button data-act="pf" data-v="${f}" aria-pressed="${S.placesFilter===f}"${S.placesFilter===f?` data-k="seg-pls"`:""}>${f}</button>`).join("")}
        </div>`}
      <div class="sheetchips sortbar${folderList?" withadd":""}" style="display:${mine?"flex":"none"}">
        ${full?`<span></span>`:`<h1 class="plstitle">내 장소<span>${folderList?` · 목록 ${folders.length}개`:` · ${rows.length}곳`}</span></h1>`}
        <button class="sortsel" data-act="sortpop" aria-haspopup="true" aria-expanded="${S.sortPop}" aria-label="정렬 · ${S.placesSort}">${S.placesSort}<span class="caret">${IC.chevD}</span></button>
        ${folderList?`<button class="listadd" data-act="addpop" aria-haspopup="menu" aria-expanded="${!!S.addPop}" aria-label="저장 목록 추가">${IC.plus}<span>추가</span></button>`:""}
        ${folderList&&S.addPop?`<div class="sortpop addpop" role="menu" aria-label="저장 목록 추가">
          <button role="menuitem" data-act="newfolder" data-v="new"><span>새 목록</span>${IC.plus}</button>
          <button role="menuitem" data-act="newfolder" data-v="import"><span class="ap-t">지도 앱에서 가져오기<small>네이버지도 · 카카오맵</small></span>${IC.link}</button>
        </div>`:""}
        ${S.sortPop?`<div class="sortpop" role="menu">
          ${["최신순","방문 횟수순","거리순"].map(f=>`<button data-act="ps" data-v="${f}" role="menuitemradio" aria-checked="${S.placesSort===f}">
            <span>${f}</span>${S.placesSort===f?`<span class="tick">${IC.check}</span>`:""}</button>`).join("")}
        </div>`:""}
      </div>
      <div class="hsbody">
        ${(S.linked&&S.placesFilter==="방문")?`<div class="syncline">${S.paused?`<span>불러오기를 멈췄어요</span><button class="sr" data-act="resume">다시 불러오기</button>`:`<span>${agoTxt()} 업데이트</span><button class="sr" data-act="refresh">새로고침</button>`}</div>`:""}
        ${folderList?`${folders.length?"":`<div class="empty"><div class="h">저장 목록이 아직 없어요</div><button class="textlink" data-act="newfolder" data-v="new">새 목록 만들기</button></div>`}<div>${folders.map(f=>`
          <button class="listrow folderrow" data-act="openfolder" data-v="${f.id}">
            <span class="fic ${f.src||"own"}" aria-hidden="true">${f.src==="naver"?"N":f.src==="kakao"?"K":"★"}</span>
            <div style="min-width:0;flex:1"><div class="nm">${esc(f.name)}</div>
              <div class="sm">${f.ids.length}곳${(()=>{const n=f.ids.filter(id=>visitOf(id)).length;return n?` · ${n}곳 방문`:"";})()}${f.src?` · ${f.src==="naver"?"네이버지도":"카카오맵"}에서 가져옴`:""}</div></div>
            <span class="sm" style="color:var(--ink-3)">${IC.chevR}</span>
          </button>`).join("")}</div>${folders.length<=1?`<div class="importcard"><span class="icw">${IC.link}</span>
            <div class="ict"><b>네이버지도·카카오맵에 저장한 곳이 있나요?</b><span>공유 링크로 목록을 그대로 가져와요</span></div>
            <button data-act="newfolder" data-v="import">가져오기</button></div>`:""}`
        :rows.length?`<div>${rows.map(r=>`
          <button class="listrow" data-act="place" data-v="${r.p.id}">
            <div style="min-width:0"><div class="nm">${esc(r.p.name)}</div>
              <div class="sm">${r.p.cat} · ${AREAS[r.p.area].name}</div></div>
            <div class="rt"><div class="sm">${r.v?r.v.n+"번":"저장"}</div>
              <div class="sm" style="color:var(--ink-3)">${r.v?r.v.days+"일 전":"미방문"}</div></div>
          </button>`).join("")}</div>`
        :`<div class="empty" style="padding:24px 12px"><div class="h">아직 없어요</div>
          ${mine&&S.placesFilter==="저장"?`<p>장소의 별을 눌러 저장하세요.</p>`:""}${(!S.linked&&S.placesFilter==="방문")?`<button class="cta" data-act="link">카드 연결하기</button>`:""}</div>`}
      </div>
    </div>
  </div>`;
};

/* 내 장소 지도 — 홈과 같은 투영·줌 상태를 쓰되 핀 의미가 다르다(방문 횟수=크기, 저장=점선 링) */
function placesMap(rows,mine){
  if(mine===undefined) mine=true;
  const W=MAPC.W,H=MAPC.H,CX=MAPC.CX,K=MAPC.K*S.z;
  const st=S.mapOnly?0:(SHEET_PLS[S.placesSheet]||SHEET_PLS.peek);
  const CY=(H-st-6)/2;                                  // 시트에 가리지 않는 영역의 중앙
  const px=x=>CX+x*K+S.px, py=y=>CY-y*K+S.py;
  MAPZ=S.mapOnly?[]:[[0,0,W,138],[W-72,H-st-16-54,W,H-st-8],[px(0)-26,py(0)-26,px(0)+26,py(0)+26]];
  { const sp=S.place&&byId(S.place); if(sp){ const a=px(gx(sp)),b=py(gy(sp)); MAPZ.push([a-15,b-36,a+15,b+4]); }
    (rows||[]).forEach(r=>{ if(r.p&&r.p.id!==S.place){ const a=px(gx(r.p)),b=py(gy(r.p)); MAPZ.push([a-9,b-9,a+9,b+9]); } }); }
  const vis=(a,b,m)=>a>-(m||40)&&a<W+(m||40)&&b>-(m||40)&&b<H-st-6;
  const lbl=S.z>=0.8;
  const clustered=S.z<ZCLUSTER;

  /* 격자 — 배율에 따라 골목이 갈라지고 합쳐진다 */
  const road=[];
  let GS=56*S.z;
  while(GS>96) GS/=2;
  while(GS<34) GS*=2;
  {
    const ox=((S.px%GS)+GS)%GS, oy=((S.py%GS)+GS)%GS;
    for(let y=oy-GS;y<H+GS;y+=GS) road.push(`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}"/>`);
    for(let x=ox-GS;x<W+GS;x+=GS) road.push(`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}"/>`);
  }

  /* 축소 상태 — 동네 단위로 접는다. 운영에서는 서버 클러스터링이 같은 일을 한다. */
  const clusters=clustered?Object.keys(AREAS).map(k=>{
    const mine2=rows.filter(r=>r.p.area===k);
    if(!mine2.length) return "";
    const A=AREAS[k], a=px(A.ax), b=py(A.ay);
    if(!vis(a,b,70)) return "";
    const seen=mine2.filter(r=>r.v).length;
    const rad=Math.min(17+Math.sqrt(mine2.length)*4.2,32);
    return `<g class="pin cluster" data-act="areazoom" data-v="${k}" tabindex="0" role="button" aria-label="${A.name} 장소 ${mine2.length}곳 · 눌러서 확대">
      <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${(rad+9).toFixed(1)}" fill="var(--ink)" opacity=".10"/>
      <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${rad.toFixed(1)}" fill="var(--ink)"/>
      <text x="${a.toFixed(1)}" y="${(b+5).toFixed(1)}" text-anchor="middle" class="clustn">${mine2.length}</text>
      <text x="${a.toFixed(1)}" y="${(b+rad+14).toFixed(1)}" text-anchor="middle" class="arealbl">${A.name}</text></g>`;
  }).join(""):"";

  /* 확대 상태 — 개별 핀. 색은 방문 여부, 크기·숫자는 방문 횟수. */
  const pins=clustered?"":rows.map(r=>{
    const a=px(gx(r.p)),b=py(gy(r.p)); if(!vis(a,b)) return "";
    if(!mine) return friendMark(r,a,b,false)+(lbl?markLabel(a,b,MK.fr,r.p.name):"");
    const n=r.v?r.v.n:0;
    return placeMark(r.p,a,b,{visited:!!r.v,selected:S.place===r.p.id,num:n>0&&n<REGULAR?n:null,reg:n>=REGULAR,   // 1~9회는 숫자, 10회 이상은 단골 표식 — '9+'는 쓰지 않는다 (v3.7)
      aria:r.v?(n>=REGULAR?" · 단골":` · ${n}번 간 곳`):" · 저장"})
      +(lbl?markLabel(a,b,S.place===r.p.id?MK.r+14:MK.r,r.p.name,S.place===r.p.id,S.place===r.p.id):"");
  }).join("");

  /* 중간 배율 — 핀은 개별로 보이지만 라벨은 접힌 구간. 동네 이름만 옅게 남긴다. */
  const areaLbls=(!clustered&&!lbl)?Object.keys(AREAS).map(k=>{
    if(!rows.some(r=>r.p.area===k)) return "";
    const A=AREAS[k], a=px(A.ax), b=py(A.ay-4.6);
    return vis(a,b)?`<text x="${a.toFixed(1)}" y="${b.toFixed(1)}" text-anchor="middle" class="arealbl big">${A.name}</text>`:"";
  }).join(""):"";

  const mx=px(0),my=py(0);
  return `<svg class="bigmap" data-act="maponly" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="내 장소 지도">
    <defs>${avatarDefs()}</defs>
    <rect width="${W}" height="${H}" fill="var(--surface-2)"/>
    <g class="roads">${road.join("")}</g>
    <line class="artery" x1="${(-W+S.px*.6).toFixed(1)}" y1="${(H*0.6+S.py).toFixed(1)}" x2="${(W*2+S.px*.6).toFixed(1)}" y2="${(H*0.44+S.py).toFixed(1)}"/>
    <line class="artery" x1="${(W*0.3+S.px).toFixed(1)}" y1="${-H}" x2="${(W*0.42+S.px).toFixed(1)}" y2="${H*2}"/>
    ${areaLbls}
    ${vis(mx,my)?meMark(mx,my):""}
    ${pins}
    ${clusters}
  </svg>`;
}

/* 홈 지도 캔버스 — 좌표는 자체 POI 원장에서만 온다. 추천 3곳은 번호 핀(색 = NEW/KNEW),
   나머지 후보 풀은 무채색 점으로 맥락만 제공한다. */
const MAPC={W:390,H:750,CX:195,CY:294,K:50};
/* 화면 중심의 전역 좌표 → 가장 가까운 동네. 위치 선택을 목록이 아니라 지도가 맡는다. */
function viewCenterArea(){
  const K=MAPC.K*S.z, x=-S.px/K, y=S.py/K;
  let best=null,bd=1e9;
  Object.keys(AREAS).forEach(k=>{const A=AREAS[k];
    const d=Math.hypot(A.ax-x,A.ay-y); if(d<bd){bd=d;best=k;}});
  return {area:best,dist:bd,x,y};
}
/* ══════════ 마커 체계 v3.3.1 ══════════
   의미 축은 셋뿐이다 — 색(가봤는지) · 형태(무엇인지) · 상태(기본·선택·흐림).
   크기는 의미를 갖지 않고, 숫자는 추천 순위와 클러스터 개수에만 쓴다. */
const MK={r:9,        // 장소 마커 반지름 (크기는 의미 없음, 전 화면 고정)
          fr:13,      // 친구 프로필 마커 반지름
          hit:22};    // 터치 영역 (≈44pt)
const FCOLOR={f1:["#C9A227","#8A6D1A"],f2:["#3F7F6E","#255245"],f3:["#7A6BC4","#4C3F8F"],rq1:["#B5566F","#8E3350"],rq2:["#4F7FB0","#2E5A87"]};
/* 프로필 사진 자리 — 실제 앱에서는 카카오 프로필 이미지가 들어가고,
   사진이 없거나 Apple 가입자면 이름 첫 글자로 떨어진다(COM-12). */
function avatarDefs(){
  return Object.keys(FCOLOR).map(k=>`<radialGradient id="av${k}" cx="30%" cy="25%">
    <stop offset="0%" stop-color="${FCOLOR[k][1]}"/><stop offset="100%" stop-color="${FCOLOR[k][1]}"/></radialGradient>`).join("");
}
function avatarMark(f,a,b,r,i,n){
  const off=i*(r*1.1)-(n-1)*r*0.55;   // 겹친 묶음의 중심을 장소 좌표에 맞춘다
  return `<g transform="translate(${off.toFixed(1)},0)">
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r+2}" fill="var(--surface)"/>
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r}" fill="url(#av${f.id})"/>
    <text x="${a.toFixed(1)}" y="${(b+r*0.36).toFixed(1)}" text-anchor="middle"
      style="font-family:var(--f-body);font-size:${(r*0.95).toFixed(1)}px;font-weight:600;fill:#fff">${esc(f.name[0])}</text></g>`;
}
/* 친구 마커 — 프로필 사진 원. 여러 명이면 최대 3장 겹치고 나머지는 +N */
function friendMark(x,a,b,dim){
  const who=x.who.slice(0,3), more=x.who.length-who.length;
  const r=MK.fr;
  return `<g class="pin" data-act="place" data-v="${x.p.id}" tabindex="0" role="button" opacity="${dim?.35:1}"
      aria-label="${esc(x.p.name)} · ${x.who.map(w=>esc(w.f.name)).join(", ")}">
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${MK.hit}" fill="transparent"/>
    ${who.map((w,i)=>avatarMark(w.f,a,b,r,i,who.length+(more?1:0))).join("")}
    ${more?`<g transform="translate(${(who.length*r*1.1-(who.length)*r*0.55).toFixed(1)},0)">
      <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r+2}" fill="var(--surface)"/>
      <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r}" fill="var(--ink-2)"/>
      <text x="${a.toFixed(1)}" y="${(b+r*0.36).toFixed(1)}" text-anchor="middle" style="font-family:var(--f-body);font-size:${(r*0.85).toFixed(1)}px;font-weight:600;fill:#fff">+${more}</text></g>`:""}</g>`;
}
/* 장소 마커 — 색을 나누지 않는다. 잉크 한 색으로 두고
   ‘가봤는지’는 채움(방문) / 비움(미방문)으로, ‘선택’은 원 → 물방울 핀으로 형태를 바꿔 구분한다.
   추천 3곳은 같은 색 규칙 위에 순위 숫자를 얹어 채움으로 띄운다.
   저장 여부는 지도에 표시하지 않는다 — 내 장소의 저장 탭이 이미 그 필터이고,
   마커에 배지를 얹으면 축이 하나 더 늘어난다. */
function placeMark(p,a,b,opt){
  const o=opt||{}, lab=o.num||(o.reg?"★":null);   // 단골은 별 표식
  const visited=o.visited, sel=o.selected, dim=o.dim, r=MK.r;
  /* 색은 한 가지만 뜻한다 — NEW IT(아직 안 가본 곳)은 메인 파랑, KNEW IT(가본 곳)은 무채색 */
  const hue=visited?"var(--knew)":"var(--new)";
  const body=sel
    /* 선택 — 지도에서 튀어나온 물방울 핀. 크기·형태가 함께 바뀌어 한눈에 구분된다 */
    ? `<path d="M ${a.toFixed(1)} ${(b+3).toFixed(1)}
         c -7 -8 -12 -12 -12 -18 a 12 12 0 1 1 24 0 c 0 6 -5 10 -12 18 z"
         fill="${hue}" stroke="var(--surface)" stroke-width="2"/>
       ${lab?`<text x="${a.toFixed(1)}" y="${(b-11).toFixed(1)}" text-anchor="middle" class="pinn" style="font-size:var(--t-c2)">${lab}</text>`
             :`<circle cx="${a.toFixed(1)}" cy="${(b-15).toFixed(1)}" r="4" fill="var(--surface)"/>`}`
    : `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r}" fill="${lab||visited?hue:"var(--surface)"}" stroke="${lab||visited?"var(--surface)":hue}" stroke-width="${lab||visited?1.5:2}"/>
       ${lab?`<text x="${a.toFixed(1)}" y="${(b+3.4).toFixed(1)}" text-anchor="middle" class="pinn" style="fill:var(--surface)">${lab}</text>`:""}`;
  return `<g class="pin${sel?" sel":""}" data-act="place" data-v="${p.id}" tabindex="0" role="button" opacity="${dim?.35:1}" aria-label="${esc(p.name)}${o.aria||""}">
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${MK.hit}" fill="transparent"/>
    ${body}</g>`;
}
let MAPZ=[];   // 지도 위 컨트롤이 차지한 영역 [x0,y0,x1,y1] — 라벨이 여기에 걸리면 숨긴다
function markLabel(a,b,r,txt,strong,force){
  const w=String(txt).length*12+6, hit=y=>MAPZ.some(([x0,y0,x1,y1])=>a+w/2>x0&&a-w/2<x1&&y>y0&&y-12<y1);
  let y=b+r+13; if(!force&&hit(y)){ y=b-r-(r>9?16:7); if(hit(y)) return ""; }
  a=Math.max(w/2+4,Math.min(MAPC.W-w/2-4,a));   // 아래가 막히면 핀 위로, 위도 막히면 숨김
  return `<text x="${a.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" class="pinlbl"${strong?' style="font-weight:600;fill:var(--ink)"':""}>${esc(txt)}</text>`;
}
/* 내 위치 — 파란 점 + 방향 콘. 파란색은 이 마커에만 쓴다. */
function meMark(a,b){
  if(!locUsable()) return "";   // 위치 약관 · iOS 권한 중 하나라도 없으면 내 위치를 그리지 않는다 (v3.10 추가분)
  if(S.os.loc==="approx") return `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="64" fill="var(--me)" opacity=".1" stroke="var(--me)" stroke-opacity=".3"/>`;   // 대략적 위치 — 점 대신 넓은 원
  return `<g><circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="22" fill="var(--me)" opacity=".12"/>
    <path d="M ${(a-7).toFixed(1)} ${(b-3).toFixed(1)} L ${a.toFixed(1)} ${(b-21).toFixed(1)} L ${(a+7).toFixed(1)} ${(b-3).toFixed(1)} Z" fill="var(--me)" opacity=".22"/>
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="8" fill="var(--surface)"/>
    <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="5.5" fill="var(--me)"/></g>`;
}

function homeMap(recos,fplaces){
  const W=MAPC.W,H=MAPC.H,CX=MAPC.CX; let K=MAPC.K*S.z;
  const shH=S.mapOnly?0:(SHEET_HOME[S.homeSheet]||SHEET_HOME.peek);
  const TOP=S.mapOnly?0:166;                            // 앱바 + 칩 줄 + 확인 알약 아래 여유
  MAPZ=S.mapOnly?[]:[[0,0,W,138],[W-72,H-shH-16-54,W,H-shH-8]];
  const CY=(TOP+H-shH-6)/2;                             // 크롬과 시트 사이 영역의 중앙
  // 처음 도착한 지도(아직 안 움직임)는 추천 핀 3개가 다 보이게 한 번만 줌을 맞춘다. 라벨이 접히는 0.8 아래로는 안 내린다.
  if(recos.length&&S.z===1&&!S.px&&!S.py&&!S.mapOnly){
    const fx=Math.max(...recos.map(r=>Math.abs(gx(r.p)))), up=Math.max(0,...recos.map(r=>gy(r.p))), dn=Math.max(0,...recos.map(r=>-gy(r.p)));
    const k=Math.min(fx?(CX-48)/fx:1e9, up?(CY-TOP-40)/up:1e9, dn?(H-shH-6-CY-74)/dn:1e9);   // 아래는 핀 밑 라벨까지
    if(k<K){ S.z=Math.max(0.7,Math.floor(k/MAPC.K*20)/20); K=MAPC.K*S.z; }
    if(dn*K>H-shH-6-CY-74) S.py=Math.round((up-dn)/2*K)||0.01;   // 그래도 시트에 걸리면 핀 묶음의 가운데로 옮긴다
  }
  const px=x=>CX+x*K+S.px, py=y=>CY-y*K+S.py;
  MAPZ.push([px(0)-26,py(0)-26,px(0)+26,py(0)+26]);
  const vis=(a,b)=>a>-40&&a<W+40&&b>-40&&b<H-shH-6;  // 화면 밖·시트 뒤는 그리지 않는다
  const lbl=S.z>=0.7;                                   // 축소 시 라벨은 접는다
  const picked=new Set(recos.map(r=>r.p.id));
  const road=[];
  let GS=56*S.z;
  while(GS>96) GS/=2;          // 확대하면 골목이 갈라지고
  while(GS<34) GS*=2;          // 축소하면 큰길만 남는다
  {
    const ox=((S.px%GS)+GS)%GS, oy=((S.py%GS)+GS)%GS;
    for(let y=oy-GS;y<H+GS;y+=GS) road.push(`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}"/>`);
    for(let x=ox-GS;x<W+GS;x+=GS) road.push(`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}"/>`);
  }
  const dots=(S.allCands||[]).filter(s2=>!picked.has(s2.p.id)).map(s2=>{
    const a=px(gx(s2.p)),b=py(gy(s2.p)); if(!vis(a,b)) return "";
    return `<g aria-hidden="true" style="pointer-events:none">
      <circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3.5" fill="var(--ink-3)" opacity=".38"/></g>`;
  }).join("");
  const fsrc=fplaces||(S.friendLayer?friendLayerPlaces():null);
  const dimPlaces=!!fsrc;                       // 친구를 보는 중이면 장소 마커는 흐림
  const fmarks=fsrc?fsrc.filter(x=>!picked.has(x.p.id)).map(x=>{
    const a=px(gx(x.p)),b=py(gy(x.p)); if(!vis(a,b)) return "";
    return friendMark(x,a,b,false)+(lbl?markLabel(a,b,MK.fr,x.p.name):"");
  }).join(""):"";
  const pins=recos.map((r,i)=>{

    return placeMark(r.p,a,b,{visited:r.type!=="NEW",num:i+1,dim:dimPlaces,
      selected:S.place===r.p.id&&!dimPlaces,aria:` · ${i+1}위 추천`})
      +(lbl?markLabel(a,b,S.place===r.p.id&&!dimPlaces?MK.r+14:MK.r,r.p.name,!dimPlaces,S.place===r.p.id&&!dimPlaces):"");
  }).join("");
  const mx=px(0),my=py(0);
